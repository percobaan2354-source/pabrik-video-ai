name: AI Video Clipper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link Video YouTube'
        required: true
        type: string
      font:
        description: 'Pilihan Font Subtitle'
        required: false
        default: 'montserrat'
        type: string

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp, FFmpeg & Paket Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-comic-neue fonts-roboto fonts-dejavu curl python3-pip
          sudo mkdir -p /usr/share/fonts/truetype/custom
          sudo curl -sL "https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf" -o /usr/share/fonts/truetype/custom/Anton-Regular.ttf
          sudo curl -sL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf" -o /usr/share/fonts/truetype/custom/Poppins-Bold.ttf
          sudo curl -sL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf" -o /usr/share/fonts/truetype/custom/Poppins-Regular.ttf
          sudo fc-cache -f -v
          pip install --break-system-packages -U "yt-dlp[default,curl-cffi]"

      - name: Install Dependensi Project
        run: |
          if [ -f package.json ]; then npm install; fi
          if [ -f requirements.txt ]; then pip install --break-system-packages -r requirements.txt; fi

      - name: Jalankan AI Clipper
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_FONT: ${{ github.event.inputs.font }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node clipper.js
