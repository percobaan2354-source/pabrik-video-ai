name: AI Video Clipper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link Video YouTube'
        required: true
        type: string
      font:
        description: 'Pilihan Font Subtitle'
        required: false
        default: 'montserrat'
        type: string

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp, FFmpeg & Paket Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-comic-neue fonts-roboto fonts-dejavu curl python3-pip
          sudo mkdir -p /usr/share/fonts/truetype/custom
          sudo curl -sL "https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf" -o /usr/share/fonts/truetype/custom/Anton-Regular.ttf
          sudo curl -sL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf" -o /usr/share/fonts/truetype/custom/Poppins-Bold.ttf
          sudo curl -sL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf" -o /usr/share/fonts/truetype/custom/Poppins-Regular.ttf
          sudo fc-cache -f -v
          sudo curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Dependensi Project
        run: |
          if [ -f package.json ]; then npm install; fi
          if [ -f requirements.txt ]; then pip install --break-system-packages -r requirements.txt; fi

      - name: Jalankan AI Clipper
        env:
          YOUTUBE_URL: ${{ github.event.inputs.url }}
          VIDEO_URL: ${{ github.event.inputs.url }}
          URL: ${{ github.event.inputs.url }}
          FONT_PILIHAN: ${{ github.event.inputs.font }}
          FONT: ${{ github.event.inputs.font }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES" > "$GITHUB_WORKSPACE/cookies.txt"
            mkdir -p ~/.config/yt-dlp
            echo "--cookies $GITHUB_WORKSPACE/cookies.txt" > ~/.config/yt-dlp/config
          fi
          node clipper.js "$YOUTUBE_URL" "$FONT_PILIHAN"
