name: Pabrik Video Otomatis

on:
  workflow_dispatch:
    inputs:
      judul:
        description: 'Judul / Topik Video'
        required: true
        default: 'Kenapa Kita Merem Saat Bersin?'
      ukuran:
        description: 'Ukuran Video (9:16, 16:9, 4:5, 1:1)'
        required: true
        default: '9:16'
      bahasa:
        description: 'Bahasa Video'
        required: true
        default: 'Indonesia'
      jadwal_wib:
        description: 'Jadwal Tayang WIB (Opsional, contoh: 2026-11-19 18:00)'
        required: false
        default: ''

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Ambil file pabrik dari repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mesin suara, FFmpeg, dan browser render
        run: |
          pip install edge-tts
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
          npm install
          npx playwright install chromium

      - name: Jalankan produksi & render video V33.0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          INPUT_JUDUL: ${{ github.event.inputs.judul }}
          INPUT_UKURAN: ${{ github.event.inputs.ukuran }}
          INPUT_BAHASA: ${{ github.event.inputs.bahasa }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1280x24" node buat_video.js

      - name: Simpan video ke repository untuk auto-upload YouTube
        env:
          INPUT_JUDUL: ${{ github.event.inputs.judul }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mp4
          git commit -m "$INPUT_JUDUL" || exit 0
          git push
