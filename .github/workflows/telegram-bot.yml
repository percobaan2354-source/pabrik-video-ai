name: Cek Perintah Telegram

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  cek-telegram:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Baca Pesan Telegram & Picu Workflow
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RES=$(curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?offset=-1")
          RAW_MSG=$(echo "$RES" | jq -r '.result[0].message.text // ""')
          CID=$(echo "$RES" | jq -r '.result[0].message.chat.id // ""')
          UP_ID=$(echo "$RES" | jq -r '.result[0].update_id // ""')

          if [[ "$CID" != "$CHAT_ID" || -z "$RAW_MSG" ]]; then
            echo "Tidak ada pesan baru dari user."
            exit 0
          fi

          # Bersihkan mention @username_bot di depan teks (otomatis muncul saat pakai tombol inline)
          MSG=$(echo "$RAW_MSG" | sed -E 's/^@[A-Za-z0-9_]+[[:space:]]*//' | xargs)

          # 1. PERINTAH: /clip [font] <link_youtube>
          if [[ "$MSG" == /clip* ]]; then
            ISI_CLIP=$(echo "$MSG" | sed -E 's/^\/clip(@[A-Za-z0-9_]+)?[[:space:]]*//' | xargs)

            # Deteksi pilihan font jika ada di depan atau belakang link
            FONT_PILIHAN="montserrat"
            for f in montserrat anton poppins comic roboto dejavu; do
              if [[ "${ISI_CLIP,,}" == *"$f"* ]]; then
                FONT_PILIHAN="$f"
                break
              fi
            done

            # Ambil URL YouTube bersih dari teks
            URL_VIDEO=$(echo "$ISI_CLIP" | grep -oE 'https?://[^[:space:]|]+' | head -n 1)

            if [[ "$URL_VIDEO" == http* ]]; then
              gh workflow run clip.yml -R "${{ github.repository }}" -f url="$URL_VIDEO" -f font="$FONT_PILIHAN"
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                -d "chat_id=$CHAT_ID" \
                -d "text=✂️ Pesanan AI Clipper diterima!%0A🔤 Font: $FONT_PILIHAN%0A🔗 Link: $URL_VIDEO"
            else
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                -d "chat_id=$CHAT_ID" \
                -d "text=⚠️ Link YouTube belum ditempel! Pencet tombol font di bawah lalu tempel link YouTube-nya."
            fi
            curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?offset=$((UP_ID + 1))" > /dev/null

          # 2. PERINTAH: /buat_en <judul>
          elif [[ "$MSG" == /buat_en* ]]; then
            JUDUL=$(echo "$MSG" | sed -E 's/^\/buat_en(@[A-Za-z0-9_]+)?[[:space:]]*//' | xargs)
            JUDUL="${JUDUL:-Amazing Science Facts}"
            gh workflow run render.yml -R "${{ github.repository }}" \
              -f judul="$JUDUL" -f ukuran="9:16" -f bahasa="Inggris"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=⚙️ Pesanan Shorts Inggris diterima: $JUDUL"
            curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?offset=$((UP_ID + 1))" > /dev/null

          # 3. PERINTAH: /buat_yt <judul>
          elif [[ "$MSG" == /buat_yt* ]]; then
            JUDUL=$(echo "$MSG" | sed -E 's/^\/buat_yt(@[A-Za-z0-9_]+)?[[:space:]]*//' | xargs)
            JUDUL="${JUDUL:-Fakta Sejarah Dunia}"
            gh workflow run render.yml -R "${{ github.repository }}" \
              -f judul="$JUDUL" -f ukuran="16:9" -f bahasa="Indonesia"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=⚙️ Pesanan Video Panjang 16:9 diterima: $JUDUL"
            curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?offset=$((UP_ID + 1))" > /dev/null

          # 4. PERINTAH LAMA: /buat <judul> | <ukuran> | <bahasa>
          elif [[ "$MSG" == /buat* ]]; then
            ISI=$(echo "$MSG" | sed -E 's/^\/buat(@[A-Za-z0-9_]+)?[[:space:]]*//')
            IFS='|' read -r JUDUL UKURAN BAHASA <<< "$ISI"
            JUDUL=$(echo "${JUDUL:-Fakta Unik}" | xargs)
            UKURAN=$(echo "${UKURAN:-9:16}" | xargs)
            BAHASA=$(echo "${BAHASA:-Indonesia}" | xargs)

            gh workflow run render.yml -R "${{ github.repository }}" \
              -f judul="$JUDUL" -f ukuran="$UKURAN" -f bahasa="$BAHASA"

            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=⚙️ Pesanan diterima: $JUDUL ($UKURAN, $BAHASA)"

            curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?offset=$((UP_ID + 1))" > /dev/null

          # 5. PERINTAH: /status -> Cek proses terakhir di GitHub Actions
          elif [[ "$MSG" == /status* ]]; then
            LAST=$(gh run list -R "${{ github.repository }}" -L 1 --json displayTitle,status,conclusion -q '.[0] | "\(.displayTitle) -> \(.status) (\(.conclusion // "berjalan"))"')
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=📊 Status terakhir: ${LAST:-Belum ada riwayat}"
            curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?offset=$((UP_ID + 1))" > /dev/null

          # 6. SAPAAN / MENU (/start, /menu, halo, dll) -> Kirim tombol yang masuk ke kolom ketik!
          else
            MENU_JSON=$(cat << 'EOF'
          {
            "inline_keyboard": [
              [
                {"text": "✂️ Clip + Montserrat", "switch_inline_query_current_chat": "/clip montserrat "},
                {"text": "💥 Clip + Anton",      "switch_inline_query_current_chat": "/clip anton "}
              ],
              [
                {"text": "✨ Clip + Poppins",    "switch_inline_query_current_chat": "/clip poppins "},
                {"text": "😄 Clip + Comic",      "switch_inline_query_current_chat": "/clip comic "}
              ],
              [
                {"text": "🎙️ Clip + Roboto",     "switch_inline_query_current_chat": "/clip roboto "},
                {"text": "🎬 Clip + DejaVu",     "switch_inline_query_current_chat": "/clip dejavu "}
              ],
              [
                {"text": "🇮🇩 Shorts Baru (/buat)",  "switch_inline_query_current_chat": "/buat "},
                {"text": "🇺🇸 Shorts EN (/buat_en)", "switch_inline_query_current_chat": "/buat_en "}
              ],
              [
                {"text": "📺 Video YT 16:9 (/buat_yt)", "switch_inline_query_current_chat": "/buat_yt "}
              ]
            ]
          }
          EOF
          )
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg cid "$CHAT_ID" --argjson rm "$MENU_JSON" '{
                chat_id: $cid,
                text: "🎬 MENU PABRIK VIDEO AI\n\nPencet salah satu tombol di bawah—teksnya otomatis masuk ke kolom ketik (tidak langsung terkirim), lalu tinggal isi judul atau tempel link YouTube-nya:",
                reply_markup: $rm
              }')"
            curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?offset=$((UP_ID + 1))" > /dev/null
          fi
