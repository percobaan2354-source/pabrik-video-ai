<style>
:root{--ink:#050b11;--panel:#101a22;--line:#1f2f3a;--txt:#ece6dc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font-family:Poppins,system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px))}
.frame{position:relative;flex:1;min-height:0;aspect-ratio:__ASPECT__;max-width:100%;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 20px 50px #000a;cursor:pointer}
canvas{display:block;width:100%;height:100%}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,11,17,.18);transition:opacity .3s;z-index:4}
.poster.hide{opacity:0;pointer-events:none}
.poster i{width:70px;height:70px;border-radius:50%;background:rgba(236,230,220,.94);box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;place-items:center}
.poster i:after{content:"";border-left:21px solid #0b141a;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
.poster p{font-weight:700;font-size:15px;letter-spacing:.14em;background:rgba(10,16,24,.78);padding:5px 14px;border-radius:20px}
.bar{display:flex;align-items:center;gap:8px;width:100%}
.btn{height:38px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:600 12.5px Poppins,sans-serif;padding:0 13px;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.go{background:#e0b877;border-color:#e0b877;color:#1a1208}
.btn.rec{animation:rc 1.2s infinite}
@keyframes rc{50%{opacity:.55}}
.play{width:44px;height:44px;border-radius:50%;background:var(--txt);border:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.play svg{width:18px;height:18px}
.sp{flex:1}
.clk{font:600 12px Poppins,sans-serif;color:#7d909a;text-align:center}
.tl{position:relative;width:100%;height:9px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden;flex-shrink:0}
.tl b{position:absolute;left:0;top:0;bottom:0;width:0;background:#e0b877}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;background:rgba(10,14,20,.94);border:1px solid rgba(255,255,255,.18);font-size:12.5px;font-weight:600;line-height:1.4;padding:9px 14px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
</style>
</head>

function extractMeaningfulWords(sentence){
 const clean=(sentence||'').replace(/[^a-zA-Z0-9\u00C0-\u024F\s]/g,' ').trim();
 const raw=clean.split(/\s+/).filter(Boolean);
 const meaningful=raw.filter(w=>w.length>=3&&!STOP_WORDS.has(w.toLowerCase()));
 return meaningful.length?meaningful:raw.filter(w=>w.length>=3);
}

/* Deteksi Visual Cerdas Berbasis Naskah VO + Hint AI dari masing-masing kalimat B-Roll */
function detectVisualFromVoScript(voSentence, aiHintObj, excludeIds=new Set()){
 const voClean=(voSentence||'').replace(/\*/g,'').trim();
 const hintObj=(aiHintObj&&typeof aiHintObj==='object')?aiHintObj:{};
 const hintText=typeof aiHintObj==='string'?aiHintObj:(hintObj.obj||'');
 const q=(hintText+' '+voClean).toLowerCase();

 let matched=null;
 for(const item of VISUAL_CATALOG){
  if(item.re.test(q) && !excludeIds.has(item.id)){
   matched=item;
   break;
  }
 }

 if(!matched){
  for(const item of VISUAL_CATALOG){
   if(item.re.test(q)){
    matched=item;
    break;
   }
  }
 }

 const words=extractMeaningfulWords(voClean);
 const autoTitle=(words.slice(0,2).join(' ')||TX.t1).toUpperCase();
 const autoSub=voClean.length>36?(voClean.slice(0,34).trim()+'…'):voClean;

 if(matched){
  return{
   id:matched.id,
   ic1:matched.ic1,
   ic2:matched.ic2,
   kicker:(hintObj.kicker||matched.kicker).toUpperCase(),
   title:(hintObj.title||matched.title).toUpperCase(),
   sub:hintObj.sub||matched.sub,
   voQuote:voClean
  };
 }

 const fallbackIcons=['pen_cap','shield','brain','coin','planet','lamp','book','heart'];
 const avail=fallbackIcons.filter(ic=>!excludeIds.has(ic));
 const ic1=avail[0]||fallbackIcons[excludeIds.size%fallbackIcons.length];
 const ic2=avail[1]||fallbackIcons[(excludeIds.size+1)%fallbackIcons.length];
 return{
  id:ic1,
  ic1,
  ic2,
  kicker:(hintObj.kicker||'VISUAL NASKAH').toUpperCase(),
  title:(hintObj.title||autoTitle).toUpperCase(),
  sub:hintObj.sub||autoSub||'Ilustrasi Adegan VO',
  voQuote:voClean
 };
}

const TITLE_OBJ=detectVisualFromVoScript(TITLE+' '+TX.t1+' '+TX.t2,null);

/* Pemetaan Visual B-Roll Per Adegan (b1, b2, b3, b4) — Memakai x[2] agar langsung terbaca! */

{

 ['b1','b2','b3','b4'].forEach(sc=>{

 });
}

function calcWordWeights(words){
 return words.map((w)=>{

function applyExactElevenLabsTimings(){
 if(!LINE_TIMINGS || LINE_TIMINGS.length !== NL) return false;
 for(let idx=0; idx<NL; idx++){
  const lt = LINE_TIMINGS[idx];
  const realStart = COVER_HOLD + Math.max(0, Number(lt.ss) || 0);
  const realEnd   = COVER_HOLD + Math.max((Number(lt.ss) || 0) + 0.25, Number(lt.se) || 0.5);

  L[idx].t0 = (idx === 0) ? COVER_HOLD : Math.max(COVER_HOLD, realStart - 0.04);
  L[idx].ss = realStart;
  L[idx].se = realEnd;

  if(Array.isArray(lt.wordTimes) && lt.wordTimes.length === L[idx].w.length){
   L[idx].wTimes = lt.wordTimes.map(pair => [
    COVER_HOLD + Math.max(0, Number(pair[0]) || 0),
    COVER_HOLD + Math.max(0, Number(pair[1]) || 0)
   ]);
  }else{
   L[idx].wTimes = null;
  }
 }
 for(let idx=0; idx<NL; idx++){
  L[idx].d = (idx < NL - 1 ? L[idx + 1].t0 : LEN) - L[idx].t0;
 }
 return true;
}

/* Fallback deteksi gelombang audio jika LINE_TIMINGS tidak tersedia */
function alignLinesToVoAudio(audioBuffer){
 if(!audioBuffer||!NL)return;
 const data=audioBuffer.getChannelData(0);
 const sr=audioBuffer.sampleRate;
 const stepSec=0.012;
 const winSize=Math.max(1,Math.floor(sr*stepSec));
 const totalWins=Math.floor(data.length/winSize);
 const env=new Float32Array(totalWins);
 let maxRms=0.001;
 for(let i=0;i<totalWins;i++){
  let sum=0;const base=i*winSize;
  for(let j=0;j<winSize;j++){const v=data[base+j];sum+=v*v}
  const rms=Math.sqrt(sum/winSize);
  env[i]=rms;
  if(rms>maxRms)maxRms=rms;
 }
 const thr=maxRms*0.065;

 const islands=[];
 let inSp=false,s0=0,sil=0;
 for(let i=0;i<totalWins;i++){
  if(env[i]>=thr){
   if(!inSp){inSp=true;s0=i}
   sil=0;
  }else if(inSp){
   sil++;
   if(sil>=6){
    islands.push({start:s0*stepSec,end:(i-sil)*stepSec});
    inSp=false;sil=0;
   }
  }
 }
 if(inSp)islands.push({start:s0*stepSec,end:totalWins*stepSec});

 while(islands.length>NL){
  let minGap=Infinity,bestIdx=0;
  for(let i=0;i<islands.length-1;i++){
   const gap=islands[i+1].start-islands[i].end;
   if(gap<minGap){minGap=gap;bestIdx=i}
  }
  islands[bestIdx].end=islands[bestIdx+1].end;
  islands.splice(bestIdx+1,1);
 }

 if(islands.length===NL){
  for(let idx=0;idx<NL;idx++){
   const isl=islands[idx];
   const realStart = COVER_HOLD + isl.start;
   const realEnd   = COVER_HOLD + Math.max(isl.start + 0.25, isl.end);
   L[idx].t0 = (idx===0) ? COVER_HOLD : Math.max(COVER_HOLD, realStart - 0.03);
   L[idx].ss = realStart;
   L[idx].se = realEnd;
  }
  for(let idx=0;idx<NL;idx++){
   L[idx].d = (idx<NL-1 ? L[idx+1].t0 : LEN) - L[idx].t0;
  }
 }

 L.forEach(l=>{
  const localSs = Math.max(0, l.ss - COVER_HOLD);
  const localSe = Math.max(localSs + 0.2, l.se - COVER_HOLD);
  const w0=Math.max(0,Math.floor(localSs/stepSec));
  const w1=Math.min(totalWins-1,Math.floor(localSe/stepSec));
  const nWords=l.w.length;
  if(nWords>0){
   const segWeights=[];
   let sumSeg=0;
   for(let k=0;k<nWords;k++){
    const a=Math.floor(w0+(k/nWords)*(w1-w0));
    const b=Math.max(a+1,Math.floor(w0+((k+1)/nWords)*(w1-w0)));
    let eSum=0;
    for(let m=a;m<=b&&m<totalWins;m++)eSum+=Math.max(thr*0.30,env[m]);
    const sw=l.wWeights[k]*(0.50+0.50*(eSum/Math.max(1,b-a+1))/maxRms);
    segWeights.push(sw);
    sumSeg+=sw;
   }
   let curT=l.ss;
   const span=Math.max(0.22,l.se-l.ss);
   l.wTimes=segWeights.map((sw,k)=>{
    const wd=(sw/sumSeg)*span;
    const pair=[curT,k===nWords-1?l.se:curT+wd];
    curT+=wd;
    return pair;
   });
  }
 });
}

function retime(){Object.keys(S0).forEach(k=>delete S0[k]);

}

/* ===== BAGIAN 3: SUBTITLE AFTER EFFECTS PAS & PRESISI PER 1 KATA ===== */
function activeWordIdx(l){
 if(!l||!l.w||!l.w.length)return-1;
 if(tm<l.ss)return-1;
 if(tm>l.se)return l.w.length-1;
 if(l.wTimes&&l.wTimes.length===l.w.length){
  for(let i=0;i<l.wTimes.length;i++){
   if(tm>=l.wTimes[i][0]&&tm<=l.wTimes[i][1])return i;
   if(i<l.wTimes.length-1 && tm>l.wTimes[i][1] && tm<l.wTimes[i+1][0])return i;
  }
 }
 const dur=Math.max(0.18,l.se-l.ss);
 const elapsed=cl((tm-l.ss)/dur,0,0.9999);
 const targetWt=elapsed*l.wWeightSum;
 let acc=0;
 for(let i=0;i<l.w.length;i++){
  acc+=l.wWeights[i];
  if(targetWt<=acc)return i;
 }
 return l.w.length-1;
}

function buildCharDynamicSub(l){
 const words=l.w;
 const out=[];
 let wIdx=0,pageId=0;
 while(wIdx<words.length){
  const pageSlice=words.slice(wIdx,wIdx+4);
  const splitAt=pageSlice.length>2?Math.ceil(pageSlice.length/2):pageSlice.length;
  const rows=[pageSlice.slice(0,splitAt),pageSlice.slice(splitAt)].filter(r=>r.length>0);

  rows.forEach((rowSlice,rowIdx)=>{
   const rowFont=AE_FONTS[(SEED+li+pageId+rowIdx)%AE_FONTS.length];
   const items=rowSlice.map((w,k)=>{
    const ff=w.em?AE_EM_FONT:rowFont;
    const baseSz=w.em?46:42;
    const weightPrefix=w.em?'italic 900':'900';
    X.font=`${weightPrefix} ${baseSz}px ${ff}`;
    const ww=X.measureText(w.s).width;
    return{s:w.s,em:w.em,idx:wIdx+(rowIdx===0?k:splitAt+k),ww,ff,baseSz,weightPrefix};
   });
   const totalSlotW=items.reduce((acc,it)=>acc+Math.ceil(it.ww*1.07)+11,0);
   const fitScale=totalSlotW>430?(430/totalSlotW):1;
   let xCursor=36;
   items.forEach(it=>{
    const adjSz=Math.max(26,Math.round(it.baseSz*fitScale));
    X.font=`${it.weightPrefix} ${adjSz}px ${it.ff}`;
    const adjW=X.measureText(it.s).width;
    const slotW=Math.ceil(adjW*1.07)+11;
    out.push({...it,sz:adjSz,ww:adjW,slotW,row:rowIdx,x:xCursor,pageId});
    xCursor+=slotW;
   });
  });
  wIdx+=pageSlice.length;
  pageId++;
 }
 return out;
}

function buildBrollSingleLine(l,maxW){
 const words=l.w;
 const pages=[];
 let cur=[],cw=0;
 words.forEach((w,idx)=>{
  const baseSz=w.em?38:35;
  X.font=`900 ${baseSz}px ${SANS}`;
  const ww=X.measureText(w.s).width;
  const slotW=Math.ceil(ww*1.10)+13;
  if(cur.length>0&&cw+slotW>maxW){
   pages.push(cur);
   cur=[];cw=0;
  }
  cur.push({s:w.s,em:w.em,idx,ww,slotW,sz:baseSz});
  cw+=slotW;
 });
 if(cur.length)pages.push(cur);

 const out=[];
 pages.forEach((pg,pageId)=>{
  const totalW=pg.reduce((a,b)=>a+b.slotW,0);
  let xCursor=360-totalW/2;
  pg.forEach(it=>{
   out.push({...it,x:xCursor,pageId,totalW});
   xCursor+=it.slotW;
  });
 });
 return out;
}

function drawSubs(){
 if(tm < COVER_HOLD) return;
 const l=L[li];if(!l)return;
 const sc=l[0];
 const isCharSpeakingOnly=(sc==='title'||sc==='a'||sc==='c'||sc==='end');
 const aw=activeWordIdx(l);
 if(aw<0)return;

 const voicePulse=CS.speaking?(1+CS.energy*0.05):1.0;

 if(isCharSpeakingOnly){
  if(lay!==li*2+1){cap=buildCharDynamicSub(l);lay=li*2+1}
  if(!cap.length)return;

  const activeItem=cap.find(it=>it.idx===aw)||cap[cap.length-1];
  const currentPage=activeItem.pageId;
  const baseY=128;
  const lineH=68;

  X.save();
  cap.forEach(item=>{
   if(item.pageId!==currentPage||item.idx>aw)return;
   const act=(item.idx===aw);
   const wStart=(l.wTimes&&l.wTimes[item.idx])?l.wTimes[item.idx][0]:l.ss;
   const pop=eo(cl((tm-wStart)/0.12));

   let scWord=1,yOff=0,xOff=0,rot=0;
   if(AE_STYLE===0){
    scWord=(0.90+0.10*pop)*(act?(1.06*voicePulse):0.98);
    yOff=(1-pop)*8-(act?2:0);
   }else if(AE_STYLE===1){
    scWord=act?(1.06*voicePulse):0.98;
    yOff=(1-pop)*14;
   }else if(AE_STYLE===2){
    scWord=(0.86+0.14*bk(pop))*(act?(1.06*voicePulse):0.98);
    rot=act?Math.sin(A*12)*0.012:0;
   }else{
    scWord=act?(1.06*voicePulse):0.98;
    xOff=(1-pop)*-8;
   }

   const weightStr = act ? (item.em ? 'italic 900' : '900') : (item.em ? 'italic 600' : '600');

   X.save();
   X.translate(item.x+xOff,baseY+item.row*lineH+yOff);
   X.rotate(rot);
   X.scale(scWord,scWord);
   X.globalAlpha=act?1.0:(0.46+0.48*pop);

   X.font=`${weightStr} ${item.sz}px ${item.ff}`;
   X.textAlign='left';X.textBaseline='middle';X.lineJoin='round';
   X.shadowColor='rgba(15,23,42,0.40)';X.shadowBlur=8;X.shadowOffsetY=3;
   X.lineWidth=act?6.5:4.5;
   X.strokeStyle='rgba(15,23,42,0.95)';
   X.strokeText(item.s,0,0);
   X.shadowColor='transparent';
   X.fillStyle=act?P.a:(item.em?'#fde047':'#ffffff');
   X.fillText(item.s,0,0);
   X.restore();
  });
  X.restore();
 }else{
  if(lay!==li*2+2){cap=buildBrollSingleLine(l,620);lay=li*2+2}
  if(!cap.length)return;

  const activeItem=cap.find(it=>it.idx===aw)||cap[cap.length-1];
  const currentPage=activeItem.pageId;
  const lineItems=cap.filter(it=>it.pageId===currentPage&&it.idx<=aw);
  if(!lineItems.length)return;

  const y=SUBY;

  X.save();
  lineItems.forEach(item=>{
   const act=(item.idx===aw);
   const weightStr = act ? '900' : '600';
   const scWord = act ? (1.08 * voicePulse) : 0.97;

   X.save();
   X.translate(item.x + item.ww*0.5, y - (act?2:0));
   X.scale(scWord, scWord);
   X.font=`${weightStr} ${item.sz}px ${SANS}`;
   X.textAlign='center';X.textBaseline='middle';X.lineJoin='round';
   X.shadowColor='rgba(15,23,42,0.35)';X.shadowBlur=8;X.shadowOffsetY=3;
   X.lineWidth=act?6.0:4.0;
   X.strokeStyle='rgba(15,23,42,0.95)';
   X.strokeText(item.s,0,0);
   X.shadowColor='transparent';
   X.fillStyle=act?P.a:(item.em?'#fde047':'#ffffff');
   X.fillText(item.s,0,0);
   X.restore();
  });
  X.restore();
 }
}

function getSceneBounds(sc){
 const lines=L.filter(x=>x[0]===sc);

 const start=lines[0].t0;
 const lastLine=lines[lines.length-1];

 return{start,end};
}

function applySceneEnterExit(sc,tAbs){
 const b=getSceneBounds(sc);
 const tIn=Math.max(0,tAbs-b.start);
 const tLeft=Math.max(0,b.end-tAbs);
 const inDur=0.36;
 const outDur=0.28;
 const style=(TRANS_STYLE+li)%4;

 if(tIn<inDur){
  const e=eo(cl(tIn/inDur));
  X.globalAlpha*=e;
  if(style===0){
   X.translate((1-e)*120*trDir,0);
  }else if(style===1){
   const scZ=0.88+0.12*e;
   X.translate(360,640);X.scale(scZ,scZ);X.translate(-360,-640);
  }else if(style===2){
   X.translate(0,(1-e)*95);
  }else{
   const scZ=0.91+0.09*e;
   X.translate(360,640);X.rotate((1-e)*0.045*trDir);X.scale(scZ,scZ);X.translate(-360,-640);
  }
 }

 if(tLeft<outDur){
  const uOut=1-cl(tLeft/outDur);
  const eOut=uOut*uOut;
  X.globalAlpha*=(1-eOut*0.65);
  if(style===0){
   X.translate(-eOut*90*trDir,0);
  }else if(style===1){
   const scZ=1+eOut*0.07;
   X.translate(360,640);X.scale(scZ,scZ);X.translate(-360,-640);
  }else if(style===2){
   X.translate(0,-eOut*75);
  }else{
   const scZ=1-eOut*0.06;
   X.translate(360,640);X.scale(scZ,scZ);X.translate(-360,-640);
  }
 }
}

function drawTransition(){
 const dt=now-trT;
 if(dt<0||dt>0.32)return;
 const u=dt/0.32;
 const alpha=Math.sin(u*Math.PI);
 const style=(TRANS_STYLE+li)%4;

 X.save();
 if(style===0||style===2){
  const sweepX=-260+u*1240;
  const grad=X.createLinearGradient(sweepX-180,0,sweepX+180,0);
  grad.addColorStop(0,'rgba(255,255,255,0)');
  grad.addColorStop(0.5,al(P.a,alpha*0.48));
  grad.addColorStop(1,'rgba(255,255,255,0)');
  X.fillStyle=grad;
  X.fillRect(0,0,W,H);
 }else if(style===1){
  const rad=60+u*720;
  X.strokeStyle=al(P.a,alpha*0.75);
  X.lineWidth=16*(1-u*0.5);
  X.beginPath();X.arc(360,640,rad,0,Math.PI*2);X.stroke();
 }else{
  const hBar=(1-u)*160;
  X.fillStyle=al(P.t,alpha*0.55);
  X.fillRect(0,0,W,hBar);
  X.fillRect(0,H-hBar,W,hBar);
 }
 X.restore();
}

 gainM.connect(ac.destination);
 gainM.connect(dest);
 an=ac.createAnalyser();an.fftSize=512;anBuf=new Float32Array(an.fftSize);
 gainVo.connect(an);

 const sr=ac.sampleRate;
 noiseBuf=ac.createBuffer(1,sr*0.5,sr);
 const d=noiseBuf.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}

function sfxTransition(variant=0){
 if(!ac||!noiseBuf)return;
 const t=ac.currentTime;
 const v=Math.abs(variant)%3;

 const src=ac.createBufferSource();
 src.buffer=noiseBuf;
 const flt=ac.createBiquadFilter();
 flt.type='bandpass';
 flt.Q.value = v===0 ? 2.2 : (v===1 ? 3.5 : 1.8);

 const fStart = v===0 ? 280 : (v===1 ? 1400 : 350);
 const fEnd   = v===0 ? 1900 : (v===1 ? 320 : 2400);
 flt.frequency.setValueAtTime(fStart,t);
 flt.frequency.exponentialRampToValueAtTime(fEnd,t+0.26);

 const g=ac.createGain();
 g.gain.setValueAtTime(0.001,t);
 g.gain.linearRampToValueAtTime(0.55,t+0.08);
 g.gain.exponentialRampToValueAtTime(0.001,t+0.28);

 src.connect(flt);flt.connect(g);g.connect(gainSfx);
 src.start(t);src.stop(t+0.30);

 if(v===2){
  const osc=ac.createOscillator(),go=ac.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(1046.5,t+0.03);
  osc.frequency.exponentialRampToValueAtTime(1567.98,t+0.18);
  go.gain.setValueAtTime(0.001,t+0.03);
  go.gain.linearRampToValueAtTime(0.24,t+0.06);
  go.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  osc.connect(go);go.connect(gainSfx);
  osc.start(t+0.03);osc.stop(t+0.26);
 }
}

function sfx(k){
 if(!ac||!k)return;
 const t=ac.currentTime;
 if(k==='c'){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(987.77,t);o.frequency.setValueAtTime(1318.5,t+.08);
  g.gain.setValueAtTime(.28,t);g.gain.exponentialRampToValueAtTime(.001,t+.36);
  o.connect(g);g.connect(gainSfx);o.start(t);o.stop(t+.38);
 }else if(k==='p'){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(1120,t+.08);
  g.gain.setValueAtTime(.26,t);g.gain.exponentialRampToValueAtTime(.001,t+.10);
  o.connect(g);g.connect(gainSfx);o.start(t);o.stop(t+.11);
 }else{
  sfxTransition(1);
 }
}

let bgmStep=0;
function bgmTick(){
 if(!ac||!playing||ac.currentTime<mNext)return;
 const notes=G_SPEC.bgm;
 const pitchShift=1+((SEED%5)-2)*0.03;
 const f=notes[(bgmStep+(SEED%3))%notes.length]*pitchShift;
 const t=ac.currentTime;

 const o=ac.createOscillator(),g=ac.createGain();
 o.type=(SEED%2===0)?'sine':'triangle';
 o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(0.001,t);
 g.gain.linearRampToValueAtTime(0.11,t+0.06);
 g.gain.exponentialRampToValueAtTime(0.001,t+0.58);
 o.connect(g);g.connect(gainBgm);
 o.start(t);o.stop(t+0.60);

 bgmStep++;
 mNext=t+(0.44+(SEED%4)*0.05);
}

function stopVoNode(){if(voSrc){try{voSrc.stop();voSrc.disconnect()}catch(_){}voSrc=null}}
function startVoFrom(offset){
 stopVoNode();
 voStartOffset = offset;
 voWallT0 = performance.now();
 if(!ac||!voBuf)return;
 voSrc=ac.createBufferSource();
 voSrc.buffer=voBuf;
 voSrc.connect(gainVo);
 if(offset < COVER_HOLD){
  const delaySec = COVER_HOLD - offset;
  voSrc.start(ac.currentTime + delaySec, 0);
  voStartCtxT = ac.currentTime;
 }else{
  const bufOff = cl(offset - COVER_HOLD, 0, Math.max(0, voBuf.duration - .02));
  voSrc.start(0, bufOff);
  voStartCtxT = ac.currentTime;
 }
}

/* ---------- render utama ---------- */
let prevInCover=true;
function render(ts){
 if(!last)last=ts;
 DT=cl((ts-last)/1000,.001,.05);last=ts;now=ts/1000;
 if(playing){
  if(voBuf&&voSrc&&ac&&ac.state==='running'&&ac.currentTime>voStartCtxT+0.01){
   tm=voStartOffset+(ac.currentTime-voStartCtxT);
  }else if(voWallT0>0){
   tm=voStartOffset+(performance.now()-voWallT0)/1000;
  }else{
   tm+=DT;
  }
  if(tm>=LEN){
   tm=LEN;playing=false;stopVoNode();updatePlayIcon();
   if(exporting)finishExport();
  }
 }

 const inCover = (tm < COVER_HOLD);
 if(prevInCover && !inCover){
  trT = now; trDir = 1;
  pScene = L[0] ? L[0][0] : 'title';
  if(playing) sfxTransition(0);
 }
 prevInCover = inCover;

 A+=DT*SPD;
 const nli=lineAt(tm);
 if(nli!==li){
  li=nli;lay=-1;
  const sc=L[li]?L[li][0]:'a';
  if(sc!==pScene){
   pScene=sc;
   if(!inCover){
    trT=now;trDir=(li%2===0)?1:-1;
    if(playing)sfxTransition(li);
   }
  }
  if(!inCover && playing && spoken!==li){spoken=li;if(L[li]&&L[li][3])sfx(L[li][3])}
 }
 charTick();
 if(playing)bgmTick();

 X.save();X.scale(SX,SY);
 const sc=L[li]?L[li][0]:'title';
 const scT=Math.max(0,tm-(L[li]?L[li].t0:0));
 if(inCover){
  X.save();
  const coverOut=Math.max(0,COVER_HOLD-tm);
  if(coverOut<0.25){
   const uOut=1-(coverOut/0.25);
   X.globalAlpha*=(1-uOut*0.55);
   X.translate(360,640);X.scale(1+uOut*0.06,1+uOut*0.06);X.translate(-360,-640);
  }
  SCN.cover(A);
  X.restore();
 }else if(SCN[sc]){
  X.save();
  applySceneEnterExit(sc,tm);
  SCN[sc](scT);
  X.restore();
 }
 drawTransition();
 drawSubs();
 drawWatermark();
 X.drawImage(ov,0,0);
 X.restore();

 $('pg').style.width=(cl(tm/LEN)*100)+'%';
 const m=Math.floor(tm/60),s=Math.floor(tm%60);
 $('clk').textContent=m+':'+(s<10?'0':'')+s;
 requestAnimationFrame(render);
}

/* ---------- kontrol & interaksi ---------- */
function show(msg,ms=3200){toast.textContent=msg;toast.classList.add('on');clearTimeout(show._t);show._t=setTimeout(()=>toast.classList.remove('on'),ms)}
function updatePlayIcon(){$('pi').innerHTML=playing?'<rect x="6" y="5" width="4" height="14" fill="#0b141a"/><rect x="14" y="5" width="4" height="14" fill="#0b141a"/>':'<path d="M6 4l14 8-14 8z" fill="#0b141a"/>';poster.classList.toggle('hide',playing)}
function togglePlay(){
 initAudio();if(ac.state==='suspended')ac.resume();
 if(!playing){
  if(tm>=LEN-.05){tm=0;spoken=-1;pScene=null;mNext=0;prevInCover=true}
  playing=true;
  startVoFrom(tm);
 }else{
  playing=false;stopVoNode();
 }
 updatePlayIcon();
}
frame.onclick=()=>exporting?0:togglePlay();
$('play').onclick=()=>exporting?0:togglePlay();
$('restart').onclick=()=>{if(exporting)return;tm=0;spoken=-1;pScene=null;mNext=0;prevInCover=true;playing=false;stopVoNode();updatePlayIcon()};
$('tl').onclick=e=>{
 if(exporting)return;
 const r=$('tl').getBoundingClientRect();
 tm=cl((e.clientX-r.left)/r.width)*LEN;
 prevInCover=(tm<COVER_HOLD);
 spoken=-1;lay=-1;mNext=0;
 if(playing)startVoFrom(tm);
};

$('exp').onclick=async()=>{
 if(exporting)return;
 initAudio();if(ac.state==='suspended')await ac.resume();
 const vStream=cv.captureStream(60);
 const combined=new MediaStream([...vStream.getVideoTracks(),...dest.stream.getAudioTracks()]);
 const mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
 const ext=mime.includes('mp4')?'mp4':'webm';
 chunks=[];
 rec=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:16000000,audioBitsPerSecond:192000});
 rec.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
 rec.onstop=()=>{
  const blob=new Blob(chunks,{type:mime});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='video_'+VARIAN+'.'+ext;
  document.body.appendChild(a);a.click();a.remove();
  $('exp').textContent='Ekspor video HD';$('exp').classList.remove('rec');
  show('Video berhasil diekspor!');
 };
 exporting=true;tm=0;spoken=-1;pScene=null;mNext=0;prevInCover=true;playing=true;updatePlayIcon();
 $('exp').textContent='Merekam HD...';$('exp').classList.add('rec');
 rec.start(200);
 startVoFrom(0);
};
function finishExport(){exporting=false;if(rec&&rec.state!=='inactive')rec.stop()}

/* ===== AUTO-LOAD ASET & MODE RENDER FRAME PRESISI UNTUK SERVER GITHUB ===== */
window.__ASSETS_READY = false;
window.__VIDEO_LEN = 40;
window.__SERVER_MODE = new URLSearchParams(window.location.search).get('autorender') === '1';

const FONTS_READY=Promise.race([
 Promise.all([
  ...['500','600','700','800','900'].map(w=>document.fonts.load(w+' 40px Poppins')),
  document.fonts.load('800 40px "Playfair Display"'),
  document.fonts.load('700 40px "Noto Sans"'),
  ...(FN?[document.fonts.load('800 40px '+FN)]:[])
 ]).then(()=>document.fonts.ready),
 new Promise(r=>setTimeout(r,5000))
]).catch(()=>{});

let prevServerCover = true;
window.__renderFrameAt = function(tSec){
 DT = 1/30;
 tm = cl(tSec, 0, LEN);
 now = tm;
 A = tm * SPD;
 playing = true;

 const inCover = (tm < COVER_HOLD);
 if(prevServerCover && !inCover){
  trT = now;
  trDir = 1;
  pScene = L[0] ? L[0][0] : 'title';
 }
 prevServerCover = inCover;

 const nli = lineAt(tm);
 if(nli !== li){
  li = nli; lay = -1;
  const sc = L[li] ? L[li][0] : 'a';
  if(sc !== pScene){
   pScene = sc;
   trDir = (li % 2 === 0) ? 1 : -1;
   if(!inCover) trT = now;
  }
 }
 charTick();

 X.save();
 X.scale(SX, SY);
 const sc = L[li] ? L[li][0] : 'title';
 const scT = Math.max(0, tm - (L[li] ? L[li].t0 : 0));
 if(inCover){
  X.save();
  const coverOut=Math.max(0,COVER_HOLD-tm);
  if(coverOut<0.25){
   const uOut=1-(coverOut/0.25);
   X.globalAlpha*=(1-uOut*0.55);
   X.translate(360,640);X.scale(1+uOut*0.06,1+uOut*0.06);X.translate(-360,-640);
  }
  SCN.cover(A);
  X.restore();
 }else if(SCN[sc]){
  X.save();
  applySceneEnterExit(sc,tm);
  SCN[sc](scT);
  X.restore();
 }
 drawTransition();
 drawSubs();
 drawWatermark();
 X.drawImage(ov, 0, 0);
 X.restore();
};

async function initAutoAssetsAndRender(){
 await FONTS_READY;
 await initCharSafe('karakter.png');
 try{
  const resp = await fetch('vo.mp3');
  if(resp.ok){
   const buf = await resp.arrayBuffer();
   const AC = window.AudioContext || window.webkitAudioContext;
   const tempAc = new AC();
   voBuf = await tempAc.decodeAudioData(buf.slice(0));
   LEN = Math.ceil(COVER_HOLD + voBuf.duration) + 1;
   retime();
   tempAc.close().catch(()=>{});
  }
 }catch(e){console.error(e)}
 window.__VIDEO_LEN = LEN;
 window.__SCENE_TIMES = L.map(l=>({sc:l[0],t0:l.t0,fx:l[3]||''}));
 window.__ASSETS_READY = true;
 if(!window.__SERVER_MODE){
  requestAnimationFrame(render);
 }
}

window.addEventListener('load', initAutoAssetsAndRender);
</script>
