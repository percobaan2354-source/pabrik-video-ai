<style>
:root{--ink:#050b11;--panel:#101a22;--line:#1f2f3a;--txt:#ece6dc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font-family:Poppins,system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px))}
.frame{position:relative;flex:1;min-height:0;aspect-ratio:__ASPECT__;max-width:100%;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 20px 50px #000a;cursor:pointer}
canvas{display:block;width:100%;height:100%}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,11,17,.18);transition:opacity .3s;z-index:4}
.poster.hide{opacity:0;pointer-events:none}
.poster i{width:70px;height:70px;border-radius:50%;background:rgba(236,230,220,.94);box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;place-items:center}
.poster i:after{content:"";border-left:21px solid #0b141a;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
.poster p{font-weight:700;font-size:15px;letter-spacing:.14em;background:rgba(10,16,24,.78);padding:5px 14px;border-radius:20px}
.bar{display:flex;align-items:center;gap:8px;width:100%}
.btn{height:38px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:600 12.5px Poppins,sans-serif;padding:0 13px;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.go{background:#e0b877;border-color:#e0b877;color:#1a1208}
.btn.rec{animation:rc 1.2s infinite}
@keyframes rc{50%{opacity:.55}}
.play{width:44px;height:44px;border-radius:50%;background:var(--txt);border:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.play svg{width:18px;height:18px}
.sp{flex:1}
.clk{font:600 12px Poppins,sans-serif;color:#7d909a;text-align:center}
.tl{position:relative;width:100%;height:9px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden;flex-shrink:0}
.tl b{position:absolute;left:0;top:0;bottom:0;width:0;background:#e0b877}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;background:rgba(10,14,20,.94);border:1px solid rgba(255,255,255,.18);font-size:12.5px;font-weight:600;line-height:1.4;padding:9px 14px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
</style>
</head>

<div class="app" id="app">

    <button class="btn" id="nextSc" title="Adegan Berikutnya">&gt;&gt;</button>
  </div>
  <div class="tl" id="tl"><b id="pg"></b></div>

 const meaningful=raw.filter(w=>w.length>=3&&!STOP_WORDS.has(w.toLowerCase()));

}

 }
 return{titleStr,subStr,words};
}

function detectVisualFromVoScript(voSentence,aiHintObj,excludeIds=new Set(),excludeIcons=new Set(),sceneIdx=0,scKey='b1'){
 const voClean=(voSentence||'').replace(/\*/g,'').trim();
 const hintObj=(aiHintObj&&typeof aiHintObj==='object')?aiHintObj:{};
 const hintText=(typeof aiHintObj==='string'?aiHintObj:(hintObj.obj||'')).toLowerCase();
 const voLow=voClean.toLowerCase();
 const sum=summarizeVoForBroll(voClean);

 const autoLayout=LAYOUT_6_POOL[(TITLE_HASH+sceneIdx*5+hash(voLow)%6)%LAYOUT_6_POOL.length];
 const chosenLayout=(hintObj.layout&&LAYOUT_6_POOL.includes(hintObj.layout))?hintObj.layout:autoLayout;
 const defaultMode=(scKey==='title'||scKey==='a'||scKey==='c')?'pip_broll':'full_broll';
 const chosenMode=hintObj.mode||defaultMode;
 const chosenAnim=hintObj.anim||['pulse','flow','rise','orbit','scan','bounce'][(TITLE_HASH+sceneIdx)%6];
 const meterMatch=voClean.match(/(\d{1,3})\s*%/);
 const meterPct=Number(hintObj.meterPct)||(meterMatch?cl(Number(meterMatch[1]),10,100):cl(35+((hash(voLow)+sceneIdx*19)%65),25,98));

 const base={
  mode:chosenMode,
  layout:chosenLayout,
  anim:chosenAnim,
  kicker:(hintObj.kicker||'ADEGAN VO').toUpperCase(),
  title:(hintObj.title||sum.titleStr).toUpperCase(),
  sub:hintObj.sub||sum.subStr||'Ilustrasi Adegan VO',
  badge:hintObj.badge||sum.words.slice(0,2).join(' ').toUpperCase()||'VISUAL VO',
  badge1:hintObj.badge1||(sum.words[0]||'TAHAP 1').toUpperCase(),
  badge2:hintObj.badge2||(sum.words[1]||sum.words[0]||'TAHAP 2').toUpperCase(),
  meterPct,
  svg:hintObj.svg||'',
  svg2:hintObj.svg2||'',
  img1:null,
  img2:null,
  voQuote:voClean
 };

 let bestItem=null,bestScore=0;
 for(const item of VISUAL_CATALOG){
  const mVo=(voLow.match(new RegExp(item.re.source,'g'))||[]).length;
  const mHint=(hintText.match(new RegExp(item.re.source,'g'))||[]).length;
  let score=mVo*5+mHint*2;
  if(score>0){
   if(!excludeIds.has(item.id))score+=2;
   if(!excludeIcons.has(item.ic1))score+=1;
   if(score>bestScore){bestScore=score;bestItem=item}
  }
 }

 if(bestItem){
  return{
   ...base,
   id:bestItem.id,
   ic1:bestItem.ic1,
   ic2:bestItem.ic2,
   kicker:(hintObj.kicker||bestItem.kicker).toUpperCase(),
   title:(hintObj.title||sum.titleStr).toUpperCase(),
   sub:hintObj.sub||sum.subStr,
   badge:hintObj.badge||bestItem.badge
  };
 }

 const hintIcon=ICONS.find(ic=>!excludeIcons.has(ic)&&new RegExp('\\b'+ic.replace(/_/g,'[_ ]')+'\\b').test(hintText));
 if(hintIcon){
  const ex2=new Set([...excludeIcons,hintIcon]);
  return{...base,id:'hint_'+hintIcon,ic1:hintIcon,ic2:pickFromPool(voLow+'2',ex2)};
 }

 const ic1=pickFromPool(voLow+TITLE_SIG,excludeIcons);
 const ic2=pickFromPool(voLow+TITLE_SIG+'b',new Set([...excludeIcons,ic1]));
 return{...base,id:ic1,ic1,ic2};
}

function sanitizeSvgString(rawSvg){
 if(!rawSvg||typeof rawSvg!=='string')return'';
 let s=rawSvg.trim();
 const start=s.indexOf('<svg');
 const end=s.lastIndexOf('</svg>');
 if(start===-1||end===-1)return'';
 s=s.slice(start,end+6);
 s=s.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<image[\s\S]*?>/gi,'');
 if(!/xmlns=/i.test(s))s=s.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
 if(!/viewBox=/i.test(s))s=s.replace('<svg','<svg viewBox="0 0 200 200"');
 return s;
}

function rasterizeSvgToImage(svgStr){
 return new Promise(resolve=>{
  const clean=sanitizeSvgString(svgStr);
  if(!clean)return resolve(null);
  try{
   const blob=new Blob([clean],{type:'image/svg+xml;charset=utf-8'});
   const url=URL.createObjectURL(blob);
   const img=new Image();
   const timer=setTimeout(()=>{URL.revokeObjectURL(url);resolve(null)},3500);
   img.onload=()=>{
    clearTimeout(timer);
    const oc=document.createElement('canvas');oc.width=480;oc.height=480;
    const og=oc.getContext('2d');
    og.drawImage(img,0,0,480,480);
    URL.revokeObjectURL(url);
    resolve(oc);
   };
   img.onerror=()=>{clearTimeout(timer);URL.revokeObjectURL(url);resolve(null)};
   img.src=url;
  }catch(_){resolve(null)}
 });
}

const SEG=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter(LANG,{granularity:'word'}):null;
function tok(str){const out=[];str.split('*').forEach((part,i)=>{if(!part)return;const em=i%2==1;
 if(SEG){for(const g of SEG.segment(part)){const s=g.segment;if(/^\s+$/.test(s)){if(out.length)out[out.length-1].sp=true;continue}
  if(g.isWordLike||!out.length||out[out.length-1].sp)out.push({s,em,sp:false});else out[out.length-1].s+=s}}
 else part.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){if(out.length)out[out.length-1].sp=true}else out.push({s:w,em,sp:false})})});return out}

function calcWordWeights(words){
 return words.map((w)=>{
  const clean=w.s.replace(/[^a-zA-Z0-9\u00C0-\u024F\u3040-\u9fff]/g,'');
  const vowels=(clean.match(/[aiueoAIUEO]/g)||[]).length;
  let wt=Math.max(1.8,clean.length*0.55+vowels*0.50);
  if(/[,;:]$/.test(w.s))wt+=1.4;
  if(/[.?!。！？…]$/.test(w.s))wt+=2.0;
  if(w.em)wt*=1.04;
  return wt;
 });
}

function applyExactElevenLabsTimings(){

   ]);

 }

  L[idx].d = (idx < NL - 1 ? L[idx + 1].t0 : LEN) - L[idx].t0;
 }
 return true;
}

function detectIslands(env,totalWins,stepSec,thr,minSil){
 const out=[];
 let inSp=false,s0=0,sil=0;
 for(let i=0;i<totalWins;i++){
  if(env[i]>=thr){
   if(!inSp){inSp=true;s0=i}
   sil=0;
  }else if(inSp){
   sil++;
   if(sil>=minSil){
    out.push({start:s0*stepSec,end:(i-sil+1)*stepSec});
    inSp=false;sil=0;
   }
  }
 }
 if(inSp)out.push({start:s0*stepSec,end:totalWins*stepSec});
 return out.filter(x=>x.end-x.start>=.06);
}

function refineWordTimesByVoice(l,env,totalWins,stepSec,thr,maxRms,w0,w1){
 const n=l.w.length;
 if(n<1||w1-w0<4)return null;
 const a=Math.max(0,w0),b=Math.min(totalWins-1,w1);
 if(b-a<4)return null;
 const len=b-a+1;
 const sm=new Float32Array(len);
 let locMax=0.0001;
 for(let i=a;i<=b;i++){
  const p=env[Math.max(0,i-1)],c=env[i],q=env[Math.min(totalWins-1,i+1)];
  const v=(p+c*2+q)/4;sm[i-a]=v;if(v>locMax)locMax=v;
 }
 const lthr=Math.max(thr*0.9,locMax*0.07);
 const voiced=new Uint8Array(len);
 let first=-1,last=-1;
 for(let i=0;i<len;i++){if(sm[i]>=lthr){voiced[i]=1;if(first<0)first=i;last=i}}
 if(first<0||last-first<3)return null;
 let gapS=-1;
 for(let i=first;i<=last;i++){
  if(!voiced[i]){if(gapS<0)gapS=i}
  else if(gapS>=0){if(i-gapS<=3){for(let k=gapS;k<i;k++)voiced[k]=1}gapS=-1}
 }
 const pauses=[];
 gapS=-1;
 for(let i=first;i<=last+1;i++){
  const un=(i<=last)?!voiced[i]:false;
  if(un){if(gapS<0)gapS=i}
  else if(gapS>=0){if(i-gapS>=6)pauses.push({s:gapS,e:i});gapS=-1}
 }
 const cum=new Float64Array(len+1);
 for(let i=0;i<len;i++){
  const v=voiced[i]?(0.6+0.4*Math.min(1,sm[i]/(locMax*0.6))):0;
  cum[i+1]=cum[i]+v;
 }
 const total=cum[len];
 if(total<=0)return null;
 const wb=l.w.map((w,k)=>{
  let x=l.wWeights[k];
  if(/[,;:]$/.test(w.s))x-=1.4;
  if(/[.?!\u3002\uff01\uff1f\u2026]$/.test(w.s))x-=2.0;
  x=Math.max(1.2,x);
  if(w.em)x*=1.10;
  if(k===n-1)x+=0.35;
  return x;
 });
 const wsum=wb.reduce((p,q)=>p+q,0)||1;
 const timeAt=c=>{
  if(c<=0)return first;
  if(c>=total)return last+1;
  let lo=0,hi=len;
  while(lo<hi-1){const mid=(lo+hi)>>1;if(cum[mid]<=c)lo=mid;else hi=mid}
  const seg=cum[lo+1]-cum[lo];
  return lo+(seg>0?(c-cum[lo])/seg:0);
 };
 const st=new Array(n),en=new Array(n);
 let acc=0;
 st[0]=first;
 for(let k=0;k<n;k++){
  acc+=wb[k];
  const C=(acc/wsum)*total;
  en[k]=(k===n-1)?(last+1):timeAt(C-1e-6);
  if(k<n-1)st[k+1]=timeAt(C);
 }
 let lastP=-1;
 for(let k=0;k<n-1;k++){
  const T=(en[k]+st[k+1])*0.5;
  const rad=/[,;:.!?\u3002\uff01\uff1f\u2026]$/.test(l.w[k].s)?28:12;
  let best=-1,bd=1e9;
  for(let pi=lastP+1;pi<pauses.length;pi++){
   const pm=(pauses[pi].s+pauses[pi].e)*0.5;
   const d=Math.abs(pm-T);
   if(d<=rad&&d<bd){bd=d;best=pi}
   if(pm>T+rad)break;
  }
  if(best>=0){
   const p=pauses[best];
   if(p.s>st[k]+3&&p.e<en[k+1]-3){
    en[k]=p.s;st[k+1]=p.e;lastP=best;
   }
  }
 }
 const LEAD=0.03;
 const out=[];
 let prevEnd=l.ss;
 for(let k=0;k<n;k++){
  let s=COVER_HOLD+(a+st[k])*stepSec-LEAD;
  let e=COVER_HOLD+(a+en[k])*stepSec;
  if(k===0)s=Math.max(l.ss,s);
  s=Math.min(Math.max(s,prevEnd),l.se);
  e=(k===n-1)?l.se:Math.min(Math.max(e,s+0.04),l.se);
  out.push([s,e]);
  prevEnd=Math.min(e,l.se);
 }
 return out;
}

function alignLinesToVoAudio(audioBuffer){
 if(!audioBuffer||!NL)return;
 const data=audioBuffer.getChannelData(0);
 const sr=audioBuffer.sampleRate;
 const stepSec=0.010;
 const winSize=Math.max(1,Math.floor(sr*stepSec));
 const totalWins=Math.floor(data.length/winSize);
 if(totalWins<20)return;
 const env=new Float32Array(totalWins);
 let maxRms=0.001;
 for(let i=0;i<totalWins;i++){
  let sum=0;const base=i*winSize;
  for(let j=0;j<winSize;j++){const v=data[base+j];sum+=v*v}
  const rms=Math.sqrt(sum/winSize);
  env[i]=rms;
  if(rms>maxRms)maxRms=rms;
 }
 const thr=maxRms*0.055;

 let islands=[];
 for(const minSil of [22,16,12,9,6]){
  islands=detectIslands(env,totalWins,stepSec,thr,minSil);
  if(islands.length-1>=NL-1)break;
 }
 if(!islands.length)return;

 const speechFirst=islands[0].start;
 const speechLast=islands[islands.length-1].end;
 const activeSpan=Math.max(1.0,speechLast-speechFirst);

 const pauseCuts=[];
 for(let k=0;k<islands.length-1;k++){
  const pStart=islands[k].end;
  const pEnd=islands[k+1].start;
  pauseCuts.push({mid:(pStart+pEnd)*0.5,prevEnd:pStart,nextStart:pEnd,dur:pEnd-pStart});
 }

 const ideal=[speechFirst];
 if(HINTS){
  for(let k=1;k<NL;k++)ideal.push((L[k-1][5][1]+L[k][5][0])*0.5);
  ideal.push(L[NL-1][5][1]);
 }else{
  let accWt=0;
  for(let i=0;i<NL;i++){
   accWt+=L[i].wt;
   ideal.push(speechFirst+(accWt/(tot||1))*activeSpan);
  }
 }

 const K=NL-1;
 let cuts=null;
 if(K===0){
  cuts=[];
 }else if(pauseCuts.length>=K){
  const M=pauseCuts.length;
  const dp=Array.from({length:K+1},()=>new Float64Array(M+1).fill(1e18));
  const parent=Array.from({length:K+1},()=>new Int32Array(M+1).fill(-1));
  dp[0][0]=0;
  for(let k=1;k<=K;k++){
   const targetT=ideal[k];
   for(let j=k;j<=M;j++){
    const cut=pauseCuts[j-1];
    const distErr=Math.abs(cut.mid-targetT);
    const pauseBonus=Math.min(0.45,cut.dur*0.65);
    const stepCost=(distErr*distErr)-pauseBonus;
    for(let p=k-1;p<j;p++){
     if(dp[k-1][p]>=1e17)continue;
     const prevT=(p===0)?speechFirst:pauseCuts[p-1].nextStart;
     if(cut.prevEnd<=prevT+0.25)continue;
     const cand=dp[k-1][p]+stepCost;
     if(cand<dp[k][j]){dp[k][j]=cand;parent[k][j]=p}
    }
   }
  }
  let bestJ=-1,bestVal=1e17;
  for(let j=K;j<=M;j++){if(dp[K][j]<bestVal){bestVal=dp[K][j];bestJ=j}}
  if(bestJ!==-1){
   const picked=[];
   let curJ=bestJ;
   for(let k=K;k>=1;k--){
    picked.unshift(pauseCuts[curJ-1]);
    curJ=parent[k][curJ];
   }
   cuts=picked;
  }
 }

 if(!cuts){
  cuts=[];
  let lastUsedIdx=-1;
  for(let k=1;k<=K;k++){
   const targetT=ideal[k];
   let bestIdx=-1,bestScore=1e9;
   for(let j=lastUsedIdx+1;j<pauseCuts.length;j++){
    const d=Math.abs(pauseCuts[j].mid-targetT);
    if(d<1.35&&d<bestScore){bestScore=d;bestIdx=j}
   }
   if(bestIdx!==-1){
    cuts.push(pauseCuts[bestIdx]);
    lastUsedIdx=bestIdx;
   }else{
    cuts.push({mid:targetT,prevEnd:targetT-0.02,nextStart:targetT+0.02,dur:0.04});
   }
  }
 }

 if(cuts&&cuts.length&&typeof pauseCuts!=='undefined'){
  for(let c=1;c<NL;c++){
   if(L[c][0]!=='cta'||!cuts[c-1])continue;
   const jc=pauseCuts.indexOf(cuts[c-1]);
   if(jc<1)continue;
   const cEndT=(c<NL-1&&cuts[c])?cuts[c].prevEnd:speechLast;
   const expDur=(L[c].wt/(tot||1))*activeSpan;
   const curDur=cEndT-cuts[c-1].nextStart;
   const cand=pauseCuts[jc-1];
   const prevLineStart=(c>=2&&cuts[c-2])?cuts[c-2].nextStart:speechFirst;
   const newDur=cEndT-cand.nextStart;
   if(curDur<expDur*0.6&&cand.prevEnd>prevLineStart+0.9&&cand.dur>=0.10&&Math.abs(newDur-expDur)<Math.abs(curDur-expDur))cuts[c-1]=cand;
  }
 }

 for(let idx=0;idx<NL;idx++){
  const prevCut=idx>0?cuts[idx-1]:null;
  const nextCut=idx<NL-1?cuts[idx]:null;
  const cStart=prevCut?prevCut.nextStart:speechFirst;
  const cEnd=nextCut?nextCut.prevEnd:speechLast;
  const lead=prevCut?Math.min(0.18,prevCut.dur*0.5):0;
  L[idx].t0=idx===0?COVER_HOLD:Math.max(COVER_HOLD,COVER_HOLD+(prevCut.nextStart-lead));
  L[idx].ss=COVER_HOLD+cStart;
  L[idx].se=COVER_HOLD+Math.max(cStart+0.25,cEnd);
 }
 for(let idx=0;idx<NL-1;idx++){
  if(L[idx+1].t0<=L[idx].t0+0.28){
   L[idx+1].t0=L[idx].t0+0.28;
   L[idx+1].ss=Math.max(L[idx+1].ss,L[idx+1].t0+0.02);
  }
 }

 L.forEach(l=>{
  const localSs=Math.max(0,l.ss-COVER_HOLD);
  const localSe=Math.max(localSs+0.2,l.se-COVER_HOLD);
  const w0=Math.max(0,Math.floor(localSs/stepSec));
  const w1=Math.min(totalWins-1,Math.floor(localSe/stepSec));
  const nWords=l.w.length;
  let voWT=null;
  try{voWT=refineWordTimesByVoice(l,env,totalWins,stepSec,thr,maxRms,w0,w1)}catch(err){voWT=null}
  if(voWT){l.wTimes=voWT;return}
  if(nWords>0){
   const segWeights=[];
   let sumSeg=0;
   for(let k=0;k<nWords;k++){
    const a=Math.floor(w0+(k/nWords)*(w1-w0));
    const b=Math.max(a+1,Math.floor(w0+((k+1)/nWords)*(w1-w0)));
    let eSum=0;
    for(let m=a;m<=b&&m<totalWins;m++)eSum+=Math.max(thr*0.30,env[m]);
    const sw=l.wWeights[k]*(0.55+0.45*(eSum/Math.max(1,b-a+1))/maxRms);
    segWeights.push(sw);
    sumSeg+=sw;
   }
   let curT=l.ss;
   const span=Math.max(0.22,l.se-l.ss);
   l.wTimes=segWeights.map((sw,k)=>{
    const wd=(sw/sumSeg)*span;
    const pair=[curT,k===nWords-1?l.se:curT+wd];
    curT+=wd;
    return pair;
   });
  }
 });
}

function retime(){
 const bodyDur=Math.max(4,LEN-COVER_HOLD);
 let acc=COVER_HOLD;
 L.forEach(l=>{
  l.t0=acc;
  l.d=bodyDur*l.wt/(tot||1);
  acc+=l.d;
  l.ss=l.t0+0.03;
  l.se=l.t0+l.d*0.94;
  l.wTimes=null;
 });
 if(HINTS&&!voBuf){
  L.forEach((l,i)=>{
   l.t0=i===0?COVER_HOLD:COVER_HOLD+(L[i-1][5][1]+l[5][0])*0.5;
   l.ss=COVER_HOLD+l[5][0];
   l.se=COVER_HOLD+l[5][1];
  });
  setVideoLen(Math.max(LEN,Math.ceil(COVER_HOLD+L[NL-1][5][1])+1));
 }
 const exactApplied = applyExactElevenLabsTimings();
 if(!exactApplied && voBuf) alignLinesToVoAudio(voBuf);
 L.forEach((l,i)=>{l.d=Math.max(0.2,(i<NL-1?L[i+1].t0:LEN)-l.t0)});
 let run=-1,rs=0;
 L.forEach((l,i)=>{
  if(i===0||l[0]!==L[i-1][0]){run++;rs=l.t0}
  l.run=run;l.rs=rs;
 });
 for(let i=NL-1;i>=0;i--){
  L[i].re=(i===NL-1)?LEN:(L[i+1][0]!==L[i][0]?L[i+1].t0:L[i+1].re);
 }
 window.LEN = LEN;
}
retime();

const RGB_CACHE={};
function rgb(c){
 if(!c||typeof c!=='string')return[255,255,255];
 const k=c.trim();
 if(RGB_CACHE[k])return RGB_CACHE[k];
 if(k[0]==='#'){
  let h=k.slice(1);
  if(h.length===3||h.length===4)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length>=6){
   const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
   if(!Number.isNaN(r)&&!Number.isNaN(g)&&!Number.isNaN(b))return RGB_CACHE[k]=[r,g,b];
  }
 }
 const m=k.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
 if(m)return RGB_CACHE[k]=[+m[1]||0,+m[2]||0,+m[3]||0];
 try{
  const d=document.createElement('canvas');d.width=d.height=1;const g=d.getContext('2d');
  g.fillStyle='#ffffff';g.fillStyle=k;g.fillRect(0,0,1,1);
  const p=g.getImageData(0,0,1,1).data;
  return RGB_CACHE[k]=[p[0],p[1],p[2]];
 }catch(_){return RGB_CACHE[k]=[255,255,255]}
}
const al=(c,a)=>{const q=rgb(c),alpha=Number.isFinite(+a)?cl(+a,0,1):1;return'rgba('+q[0]+','+q[1]+','+q[2]+','+alpha+')'};
const shade=(c,amt)=>{const q=rgb(c);return'rgb('+cl(Math.round(q[0]+amt),0,255)+','+cl(Math.round(q[1]+amt),0,255)+','+cl(Math.round(q[2]+amt),0,255)+')'};
const mixC=(a,b,t)=>{const p=rgb(a),q=rgb(b);return'rgb('+Math.round(p[0]+(q[0]-p[0])*t)+','+Math.round(p[1]+(q[1]-p[1])*t)+','+Math.round(p[2]+(q[2]-p[2])*t)+')'};
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function txt(s,x,y,sz,col,al2='center',w=800,st=0,ff=SANS){X.font=`${w} ${sz}px ${ff}`;X.direction=RTL?'rtl':'ltr';X.textAlign=al2;X.textBaseline='middle';X.lineJoin='round';if(st){X.lineWidth=st;X.strokeStyle='rgba(8,12,20,.95)';X.strokeText(s,x,y)}X.fillStyle=col;X.fillText(s,x,y)}
const fz=(t,mw,sz,ff=SANS)=>{X.font=`800 ${sz}px ${ff}`;const w=X.measureText(t).width;return w>0?Math.min(sz,sz*mw/w):sz};
const tg=(y,f,colA,colB)=>{const g=X.createLinearGradient(0,y-f*.5,0,y+f*.5);g.addColorStop(0,colA);g.addColorStop(1,colB);return g};

function vol(){const l=L[li];

  CS.pt=A;
  CS.dir=(li%2===0)?1:-1;
 }

 const rawMv=vol();
 CS.energy=rawMv;
 CS.speaking=rawMv>.022;
 const mAlpha=rawMv>CS.mv?(1-Math.pow(.00005,DT)):(1-Math.pow(.001,DT));
 CS.mv+=(rawMv-CS.mv)*mAlpha;

 const aw=activeWordIdx(l);

 const e0=(wd&&wd.em)?1:0;
 CS.ev+=((playing?e0:0)-CS.ev)*(1-Math.pow(.02,DT));

 CS.breath=S(A*2.4)*0.014;
 const targetNod=playing?(CS.ev*8+CS.mv*3.5):0;
 CS.nod+=(targetNod-CS.nod)*(1-Math.pow(.008,DT));

 const amp={e:1.25,d:1.10,s:.70}[l[1]]||0.95;
 const targetTilt=playing?((S(A*2.1)*.028+S(A*3.6)*.012)*amp*(CS.speaking?1:.35)):S(A*.7)*.010;
 const targetSway=playing?((S(A*1.6)*7+S(A*3.0)*3.0)*amp*(CS.speaking?1:.4)):S(A*.65)*2.0;
 const targetBounce=playing?(CS.mv*14*amp+CS.ev*8):0;

 const mvLerp=1-Math.pow(.005,DT);
 CS.tilt+=(targetTilt-CS.tilt)*mvLerp;
 CS.sway+=(targetSway-CS.sway)*mvLerp;

function poseXf(id,u,d){
 const e=eo(cl(u/.55)),b=bk(cl(u/.65));
 switch(id){

function char(o={}){

 char._x+=(tx-char._x)*pLerp;

 if(animType==='pulse')return{dx:0,dy:Math.sin(A*4.2)*6*amp,sc:1+Math.sin(A*5.5)*0.055*amp,rot:0};
 if(animType==='flow')return{dx:Math.sin(A*2.8)*10*amp,dy:Math.cos(A*2.2)*4,sc:1.02,rot:Math.sin(A*2.4)*0.03};
 if(animType==='rise')return{dx:0,dy:(1-eo(cl(tLine/0.55)))*26+Math.sin(A*2.5)*5,sc:0.96+0.06*eo(cl(tLine/0.45)),rot:0};
 if(animType==='orbit')return{dx:Math.cos(A*2.5)*9*amp,dy:Math.sin(A*2.5)*9*amp,sc:1.03,rot:Math.sin(A*2.0)*0.05};
 if(animType==='scan')return{dx:0,dy:Math.sin(A*3.0)*6,sc:1+0.04*amp,rot:Math.sin(A*1.8)*0.03};
 return{dx:0,dy:-Math.abs(Math.sin(A*4.5))*11*amp,sc:1+Math.abs(Math.sin(A*4.5))*0.05,rot:0};
}

function wrapText(text,maxW,sz,weight=700){
 X.font=`${weight} ${sz}px ${SANS}`;
 const words=text.split(' ');
 const lines=[];
 let cur='';
 words.forEach(w=>{
  const test=cur?cur+' '+w:w;
  if(X.measureText(test).width>maxW&&cur){
   lines.push(cur);
   cur=w;
  }else{
   cur=test;
  }
 });
 if(cur)lines.push(cur);
 return lines;
}

/* ===== SUBTITLE DINAMIS PER KALIMAT VO (SINKRON 100% DENGAN AUDIO) ===== */
function activeWordIdx(l){
 if(!l||!l.w.length||tm<COVER_HOLD)return -1;
 if(tm>l.se+0.30)return -1;
 const n=l.w.length;
 if(l.wTimes&&l.wTimes.length===n){
  if(tm<l.wTimes[0][0]-0.05)return 0;
  for(let i=0;i<n;i++){
   if(tm>=l.wTimes[i][0]-0.03&&tm<=l.wTimes[i][1]+0.04)return i;
  }
  for(let i=n-1;i>=0;i--){
   if(tm>=l.wTimes[i][0])return i;
  }
  return 0;
 }
 const dur=Math.max(0.25,l.se-l.ss);
 const elapsed=cl(tm-l.ss,0,dur);
 const targetWt=(elapsed/dur)*l.wWeightSum;
 let acc=0;
 for(let i=0;i<n;i++){
  acc+=l.wWeights[i];
  if(targetWt<=acc)return i;
 }
 return n-1;
}

function measureWordW(w,sz,isEm,isAct){
 const scale=isAct?1.12:(isEm?1.04:1.0);
 const ff=isEm?AE_EM_FONT:AE_FONTS[AE_STYLE%AE_FONTS.length];
 const wt=isAct?900:(isEm?900:800);
 X.font=`${wt} ${Math.round(sz*scale)}px ${ff}`;
 return X.measureText(w.s).width;
}

function layout(l){
 const W0=l.w;if(!W0.length)return{rows:[],sz:40};
 const lim=630,sz=CJK?44:42;
 X.font=`800 ${sz}px ${SANS}`;
 const spW=CJK?0:X.measureText(' ').width*1.12;
 const rows=[];let cur=[],cw=0;
 W0.forEach((w,idx)=>{
  const ww=measureWordW(w,sz,w.em,false);
  const addSp=(cur.length>0&&!CJK)?spW:0;
  if(cur.length>0&&cw+addSp+ww>lim){
   rows.push(cur);
   cur=[{w,idx,ww}];
   cw=ww;
  }else{
   cur.push({w,idx,ww});
   cw+=addSp+ww;
  }
 });
 if(cur.length)rows.push(cur);
 return{rows,sz,spW};
}

function drawSubs(){
 if(tm<COVER_HOLD)return;
 const l=L[li];if(!l||!l.w.length)return;
 const aw=activeWordIdx(l);
 const u=Math.max(0,tm-l.t0);
 const popIn=bk(cl(u/0.16));

 if(lay!==li){lay=li;drawSubs.c=layout(l)}
 const{rows,sz,spW}=drawSubs.c;
 const lh=sz*1.36;
 const totalH=rows.length*lh;
 const baseY=SUBY-totalH*0.5+lh*0.5;

 X.save();
 X.translate(360,baseY);
 X.scale(0.95+0.05*popIn,0.95+0.05*popIn);
 X.translate(-360,-baseY);

 rows.forEach((row,ri)=>{
  const ry=baseY+ri*lh;
  let rw=0;
  row.forEach((item,ii)=>{
   const isAct=(item.idx===aw);
   const wCur=measureWordW(item.w,sz,item.w.em,isAct);
   item.wCur=wCur;
   rw+=wCur+(ii<row.length-1?spW:0);
  });

  let cx=360-rw*0.5;
  row.forEach((item)=>{
   const{w,idx,wCur}=item;
   const isAct=(idx===aw);
   const isPast=(aw>=0&&idx<aw);
   const isEm=w.em;

   let wordPop=0;
   if(isAct){
    const wStart=(l.wTimes&&l.wTimes[idx])?l.wTimes[idx][0]:l.ss;
    wordPop=Math.sin(cl((tm-wStart)/0.14)*Math.PI);
   }

   const scale=isAct?(1.12+wordPop*0.08):(isEm?1.04:1.0);
   const fSize=Math.round(sz*scale);
   const ff=isEm?AE_EM_FONT:AE_FONTS[AE_STYLE%AE_FONTS.length];
   const fWeight=isAct?900:(isEm?900:800);
   const wx=cx+wCur*0.5;
   const wy=ry-(isAct?wordPop*8:0);

   if(isAct){
    X.save();
    const pillPadX=13,pillPadY=8;
    const pw=wCur+pillPadX*2,ph=fSize+pillPadY*1.6;
    X.shadowColor='rgba(15,23,42,0.45)';
    X.shadowBlur=16;
    X.shadowOffsetY=5;
    X.fillStyle=isEm?P.t:P.a;
    rr(wx-pw*0.5,wy-ph*0.5,pw,ph,16);
    X.fill();
    X.strokeStyle='#0f172a';
    X.lineWidth=3.2;
    rr(wx-pw*0.5,wy-ph*0.5,pw,ph,16);
    X.stroke();
    X.restore();
   }

   let fillCol='#ffffff';
   if(isAct)fillCol='#091017';
   else if(isEm)fillCol=P.a;
   else if(isPast)fillCol='#f1f5f9';

   X.save();
   X.font=`${fWeight} ${fSize}px ${ff}`;
   X.textAlign='center';
   X.textBaseline='middle';
   X.lineJoin='round';

   if(!isAct){
    X.lineWidth=11;
    X.strokeStyle='rgba(8,12,20,0.95)';
    X.strokeText(w.s,wx,wy+3);
   }
   X.fillStyle=fillCol;
   X.fillText(w.s,wx,wy);
   X.restore();

   cx+=wCur+spW;
  });
 });
 X.restore();
}

function drawTransition(){
 const dt=tm-trT;
 if(dt<0||dt>0.26)return;
 const u=dt/0.26;
 const alpha=(1-u)*0.35;
 X.save();

 }else if(TRANS_STYLE===1){

 }else if(TRANS_STYLE===2){

  X.fillRect(0,0,W,barH);
  X.fillRect(0,H-barH,W,barH);

/* ===== EFEK KAMERA SINEMATIK, LIGHT LEAK, & PARTIKEL ===== */
function applyCinematicCamera(){
 const cur=L[li];
 const sc=cur?cur[0]:'cover';
 const u=cur?cl((tm-cur.t0)/Math.max(0.25,cur.d)):0;
 let zoom=1.0,panX=0,panY=0;
 if(tm<COVER_HOLD){
  zoom=1.0+0.035*eo(cl(tm/COVER_HOLD));
 }else if(sc==='cta'){
  zoom=1.01+0.03*eo(u);
 }else if(/^b\d+$/.test(sc)){
  const dir=(li%2===0)?1:-1;
  zoom=1.015+0.032*u;
  panX=dir*9*(u-0.5);
  panY=-5*u;
 }else{
  zoom=1.0+0.015*Math.sin(u*Math.PI);
  panX=Math.sin(A*0.75)*5;
  panY=Math.cos(A*0.60)*4;
 }
 const punch=(CS.speaking&&Number.isFinite(CS.energy))?CS.energy*0.008:0;
 const scTotal=zoom+punch;
 X.translate(360+panX,640+panY);
 X.scale(scTotal,scTotal);
 X.translate(-360,-640);
}

function applySceneEnterExit(t){
 const cur=L[li];if(!cur||tm<COVER_HOLD)return;
 const uIn=cl((tm-cur.t0)/0.22);
 if(uIn<1){
  const e=eo(uIn);
  const dir=(li%2===0)?1:-1;
  X.translate(dir*18*(1-e),10*(1-e));
  X.globalAlpha*=0.55+0.45*e;
 }
}

function drawLightLeak(){
 const cur=L[li];
 const boost=(cur&&(cur[1]==='e'||cur[1]==='d'))?1.35:0.95;
 const lx=360+Math.sin(A*0.52)*340;
 const ly=160+Math.cos(A*0.38)*110;
 X.save();
 X.globalCompositeOperation='screen';
 const g1=X.createRadialGradient(lx,ly,10,lx,ly,440);
 g1.addColorStop(0,al(P.a,0.16*boost));
 g1.addColorStop(0.55,al(P.t,0.07*boost));
 g1.addColorStop(1,'rgba(255,255,255,0)');
 X.fillStyle=g1;

 X.restore();
}

function drawAmbientParticles(){
 const cur=L[li];
 const isEn=(cur&&(cur[1]==='e'||cur[1]==='d'));
 const count=isEn?14:8;
 X.save();
 for(let i=0;i<count;i++){
  const seed=(TITLE_HASH+i*977)>>>0;
  const px=((seed%680)+Math.sin(A*(0.55+(i%4)*0.18)+i)*28+720)%720;
  const py=1280-((A*(28+(i%5)*14)+(seed%1280))%1280);
  const r=2.0+(i%3)*1.6;
  const alP=0.14+0.18*Math.sin(A*2.2+i*1.7);
  X.fillStyle=(i%2===0)?al(P.a,alP):`rgba(255,255,255,${alP})`;
  X.beginPath();X.arc(px,py,r,0,Math.PI*2);X.fill();
 }
 X.restore();
}

function drawEmphasisBurst(){
 if(tm<COVER_HOLD)return;
 const l=L[li];if(!l||!l.w.length)return;
 const aw=activeWordIdx(l);
 const wd=aw>=0?l.w[aw]:null;
 if(!wd||!wd.em)return;
 const wStart=(l.wTimes&&l.wTimes[aw])?l.wTimes[aw][0]:l.ss;
 const dt=tm-wStart;
 if(dt<0||dt>0.34)return;
 const u=dt/0.34;
 const ease=eo(u);
 X.save();
 X.translate(360,SUBY-10);
 for(let k=0;k<8;k++){
  const ang=(k/8)*Math.PI*2+0.35;
  const r0=45+ease*85;
  const r1=r0+24*(1-u);
  X.strokeStyle=al(P.a,(1-u)*0.85);
  X.lineWidth=4*(1-u)+1;
  X.beginPath();
  X.moveTo(Math.cos(ang)*r0,Math.sin(ang)*r0);
  X.lineTo(Math.cos(ang)*r1,Math.sin(ang)*r1);
  X.stroke();
 }
 X.restore();
}

function render(){

 if(i!==li){

 fn(tm<COVER_HOLD?tm:Math.max(0,tm-L[li].t0));

/* ===== AUDIO ENGINE: VOICE OVER + BGM DINAMIS PER JUDUL + SFX ===== */
let ac=null,dest=null,gainM=null,noiseBuf=null,voReady=false;
const AC=window.AudioContext||window.webkitAudioContext;

function initAudio(){
 if(ac)return;
 ac=new AC();
 dest=ac.createMediaStreamDestination();
 gainM=ac.createGain();
 gainM.gain.value=0.92;
 gainM.connect(ac.destination);
 gainM.connect(dest);

 an=ac.createAnalyser();
 an.fftSize=512;
 anBuf=new Float32Array(an.fftSize);

 const len=ac.sampleRate*1.5;
 noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
 const d=noiseBuf.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*0.35));
}

function playSfx(type){
 if(!ac||!gainM)return;
 const t0=ac.currentTime;
 if(type==='whoosh'){
  const src=ac.createBufferSource();src.buffer=noiseBuf;
  const flt=ac.createBiquadFilter();flt.type='bandpass';flt.Q.value=1.8;
  flt.frequency.setValueAtTime(280,t0);
  flt.frequency.exponentialRampToValueAtTime(1400,t0+0.18);
  const g=ac.createGain();
  g.gain.setValueAtTime(0.001,t0);
  g.gain.linearRampToValueAtTime(0.11,t0+0.06);
  g.gain.exponentialRampToValueAtTime(0.001,t0+0.28);
  src.connect(flt);flt.connect(g);g.connect(gainM);
  src.start(t0);src.stop(t0+0.30);
 }else if(type==='p'){
  const osc=ac.createOscillator();osc.type='sine';
  osc.frequency.setValueAtTime(480,t0);
  osc.frequency.exponentialRampToValueAtTime(860,t0+0.09);
  const g=ac.createGain();
  g.gain.setValueAtTime(0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+0.12);
  osc.connect(g);g.connect(gainM);
  osc.start(t0);osc.stop(t0+0.13);
 }else if(type==='c'){
  [880,1174.66].forEach((freq,idx)=>{
   const osc=ac.createOscillator();osc.type='triangle';
   osc.frequency.setValueAtTime(freq,t0+idx*0.06);
   const g=ac.createGain();
   g.gain.setValueAtTime(0.10,t0+idx*0.06);
   g.gain.exponentialRampToValueAtTime(0.001,t0+idx*0.06+0.25);
   osc.connect(g);g.connect(gainM);
   osc.start(t0+idx*0.06);osc.stop(t0+idx*0.06+0.26);
  });
 }
}

const BGM_BASE=G_SPEC.bgm||[261.63,329.63,392.00,493.88,392.00,329.63];
const BGM_SHIFT=Math.pow(2,((TITLE_HASH%7)-3)/12);
const BGM_NOTES=BGM_BASE.map(f=>f*BGM_SHIFT);
const BGM_STEP=ACTIVE_GENRE==='horor'||ACTIVE_GENRE==='psikologi'?0.54:(ACTIVE_GENRE==='sains'||ACTIVE_GENRE==='bisnis'?0.38:0.46);
let bgmIdx=0;
function musicTick(){
 if(!playing||!ac||!gainM)return;
 if(ac.currentTime<mNext)return;
 const t0=ac.currentTime;
 const f=BGM_NOTES[bgmIdx%BGM_NOTES.length];
 bgmIdx++;
 mNext=t0+BGM_STEP;

 const osc=ac.createOscillator();
 osc.type=ACTIVE_GENRE==='horor'?'triangle':'sine';
 osc.frequency.setValueAtTime(f,t0);
 const g=ac.createGain();
 const duck=CS.speaking?0.022:0.045;
 g.gain.setValueAtTime(0.0001,t0);
 g.gain.linearRampToValueAtTime(duck,t0+0.04);
 g.gain.exponentialRampToValueAtTime(0.0001,t0+0.42);
 osc.connect(g);g.connect(gainM);
 osc.start(t0);osc.stop(t0+0.44);
}

function stopVo(){
 if(voSrc){
  try{voSrc.stop();voSrc.disconnect()}catch(_){}
  voSrc=null;
 }
}

function startVoFrom(videoTimeSec){
 stopVo();
 if(!ac||!voBuf)return;
 const offset=Math.max(0,videoTimeSec-COVER_HOLD);
 if(offset>=voBuf.duration-0.02)return;

 const src=ac.createBufferSource();
 src.buffer=voBuf;
 const g=ac.createGain();
 g.gain.value=1.18;
 src.connect(g);
 g.connect(an);
 g.connect(gainM);

 const delaySec=Math.max(0,COVER_HOLD-videoTimeSec);
 const startAt=ac.currentTime+delaySec;
 src.start(startAt,offset);

 voSrc=src;
 voStartCtxT=startAt;
 voStartOffset=offset;
 voWallT0=performance.now()*0.001-(videoTimeSec-delaySec);
}

async function loadVoBuffer(){
 if(!DATA.audioUrl)return false;
 try{
  initAudio();
  const res=await fetch(DATA.audioUrl);
  if(!res.ok)return false;
  const arr=await res.arrayBuffer();
  voBuf=await ac.decodeAudioData(arr);
  voReady=true;
  setVideoLen(Math.max(LEN,Math.ceil(COVER_HOLD+voBuf.duration+0.9)));
  retime();
  return true;
 }catch(_){
  return false;
 }
}

/* ===== MAIN ANIMATION LOOP ===== */
function tick(nowMs){
 requestAnimationFrame(tick);
 if(!last)last=nowMs;
 DT=cl((nowMs-last)*0.001,0.001,0.08);
 last=nowMs;

 if(playing){
  A+=DT;
  if(voSrc&&ac){
   const elapsedAudio=ac.currentTime-voStartCtxT;
   if(elapsedAudio>=0){
    tm=COVER_HOLD+voStartOffset+elapsedAudio+SYNC;
   }else{
    tm+=DT;
   }
  }else{
   tm+=DT;
  }

  musicTick();
  ambientTick();

  const curIdx=tm<COVER_HOLD?0:lineAt(tm);
  if(curIdx!==spoken&&tm>=COVER_HOLD){
   spoken=curIdx;
   const fx=L[curIdx]?L[curIdx][3]:'';
   if(fx==='p'||fx==='c')playSfx(fx);
   else if(curIdx>0&&L[curIdx][0]!==L[curIdx-1][0])playSfx('whoosh');
  }

  if(tm>=LEN){
   tm=LEN;
   render();
   setPlay(false);
   if(exporting&&rec&&rec.state==='recording'){
    rec.stop();
   }
  }else{
   render();
  }
 }else{
  A+=DT*0.45;
  render();
 }

 clk.textContent=fmtTime(tm)+' / '+fmtTime(LEN);
 pg.style.width=(cl(tm/LEN)*100)+'%';
}

/* ===== BOOT SEQUENCE ===== */
(async function boot(){
 try{
  if(document.fonts&&document.fonts.ready){
   await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]);
  }
 }catch(_){}

 const tasks=[preloadAllDynamicSvgs()];
 if(DATA.charUrl)tasks.push(initCharSafe(DATA.charUrl));
 if(DATA.audioUrl)tasks.push(loadVoBuffer());
 await Promise.all(tasks);

 retime();
 render();
 window.__READY__=true;
 window.__APP_READY__=true;
 requestAnimationFrame(tick);
})();
</script>
