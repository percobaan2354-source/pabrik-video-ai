<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>__TITLE__</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,800;1,900&family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@700&family=Oswald:wght@700&family=Cinzel:wght@700;900&family=Bebas+Neue&family=Noto+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#050b11;--panel:#101a22;--line:#1f2f3a;--txt:#ece6dc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font-family:Poppins,system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px))}
.frame{position:relative;flex:1;min-height:0;aspect-ratio:__ASPECT__;max-width:100%;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 20px 50px #000a;cursor:pointer}
canvas{display:block;width:100%;height:100%}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,11,17,.18);transition:opacity .3s;z-index:4}
.poster.hide{opacity:0;pointer-events:none}
.poster i{width:70px;height:70px;border-radius:50%;background:rgba(236,230,220,.94);box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;place-items:center}
.poster i:after{content:"";border-left:21px solid #0b141a;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
.poster p{font-weight:700;font-size:15px;letter-spacing:.14em;background:rgba(10,16,24,.78);padding:5px 14px;border-radius:20px}
.bar{display:flex;align-items:center;gap:8px;width:100%}
.btn{height:38px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:600 12.5px Poppins,sans-serif;padding:0 13px;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.go{background:#e0b877;border-color:#e0b877;color:#1a1208}
.btn.rec{animation:rc 1.2s infinite}
@keyframes rc{50%{opacity:.55}}
.play{width:44px;height:44px;border-radius:50%;background:var(--txt);border:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.play svg{width:18px;height:18px}
.sp{flex:1}
.clk{font:600 12px Poppins,sans-serif;color:#7d909a;text-align:center}
.tl{position:relative;width:100%;height:9px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden;flex-shrink:0}
.tl b{position:absolute;left:0;top:0;bottom:0;width:0;background:#e0b877}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;background:rgba(10,14,20,.94);border:1px solid rgba(255,255,255,.18);font-size:12.5px;font-weight:600;line-height:1.4;padding:9px 14px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="frame" id="frame">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
    <div class="poster" id="poster"><i></i><p id="posterTxt">PUTAR</p></div>
  </div>
  <div class="bar">
    <button class="btn" id="restart">Ulang</button><span class="sp clk" id="clk">0:00</span>
    <button class="play" id="play" aria-label="Putar"><svg viewBox="0 0 24 24" id="pi"><path d="M6 4l14 8-14 8z" fill="#0b141a"/></svg></button>
    <span class="sp"></span>
  </div>
  <div class="tl" id="tl"><b id="pg"></b></div>
  <div class="bar">
    <button class="btn go" id="exp" style="width:100%">Ekspor video HD</button>
  </div>
</div>

{

]);

function extractMeaningfulWords(sentence){
 const clean=(sentence||'').replace(/[^a-zA-Z0-9\u00C0-\u024F\s]/g,' ').trim();
 const raw=clean.split(/\s+/).filter(Boolean);
 const meaningful=raw.filter(w=>w.length>=3&&!STOP_WORDS.has(w.toLowerCase()));
 return meaningful.length?meaningful:raw.filter(w=>w.length>=3);
}

const SEG=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter(LANG,{granularity:'word'}):null;
function tok(str){const out=[];str.split('*').forEach((part,i)=>{if(!part)return;const em=i%2==1;
 if(SEG){for(const g of SEG.segment(part)){const s=g.segment;if(/^\s+$/.test(s)){if(out.length)out[out.length-1].sp=true;continue}
  if(g.isWordLike||!out.length||out[out.length-1].sp)out.push({s,em,sp:false});else out[out.length-1].s+=s}}
 else part.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){if(out.length)out[out.length-1].sp=true}else out.push({s:w,em,sp:false})})});return out}

function calcWordWeights(words){
 return words.map((w,idx)=>{
  const clean=w.s.replace(/[^a-zA-Z0-9\u00C0-\u024F\u3040-\u9fff]/g,'');
  const vowels=(clean.match(/[aiueoAIUEO]/g)||[]).length;
  let wt=Math.max(2.0,clean.length*0.60+vowels*0.55);
  if(idx===0)wt+=0.55;
  if(/[,;:]$/.test(w.s))wt+=2.2;
  if(/[.?!。！？…]$/.test(w.s))wt+=3.2;
  if(w.em)wt*=1.05;
  return wt;
 });
}

/* ===== DETEKSI INTONASI & JEDA VO PRESISI PER KATA ===== */
function alignLinesToVoAudio(audioBuffer){
 if(!audioBuffer||!NL)return;
 const data=audioBuffer.getChannelData(0);
 const sr=audioBuffer.sampleRate;
 const stepSec=0.015;
 const winSize=Math.max(1,Math.floor(sr*stepSec));
 const totalWins=Math.floor(data.length/winSize);
 const env=new Float32Array(totalWins);
 let maxRms=0.001;
 for(let i=0;i<totalWins;i++){
  let sum=0;const base=i*winSize;
  for(let j=0;j<winSize;j++){const v=data[base+j];sum+=v*v}
  const rms=Math.sqrt(sum/winSize);
  env[i]=rms;
  if(rms>maxRms)maxRms=rms;
 }
 const thr=maxRms*0.068;

 const islands=[];
 let inSp=false,s0=0,sil=0;
 for(let i=0;i<totalWins;i++){
  if(env[i]>=thr){
   if(!inSp){inSp=true;s0=i}
   sil=0;
  }else if(inSp){
   sil++;
   if(sil>=5){
    islands.push({start:s0*stepSec,end:(i-sil)*stepSec});
    inSp=false;sil=0;
   }
  }
 }
 if(inSp)islands.push({start:s0*stepSec,end:totalWins*stepSec});

 while(islands.length>NL){
  let minGap=Infinity,bestIdx=0;
  for(let i=0;i<islands.length-1;i++){
   const gap=islands[i+1].start-islands[i].end;
   if(gap<minGap){minGap=gap;bestIdx=i}
  }
  islands[bestIdx].end=islands[bestIdx+1].end;
  islands.splice(bestIdx+1,1);
 }

 if(islands.length===NL){
  for(let idx=0;idx<NL;idx++){
   const isl=islands[idx];
   L[idx].t0=(idx===0)?0:Math.max(0,isl.start-0.05);
   L[idx].ss=isl.start;
   L[idx].se=Math.max(isl.start+0.22,isl.end);
  }
  for(let idx=0;idx<NL;idx++){
   L[idx].d=(idx<NL-1?L[idx+1].t0:LEN)-L[idx].t0;
  }
 }

 L.forEach(l=>{
  const w0=Math.max(0,Math.floor(l.ss/stepSec));
  const w1=Math.min(totalWins-1,Math.floor(l.se/stepSec));
  const nWords=l.w.length;
  if(nWords>0){
   const segWeights=[];
   let sumSeg=0;
   for(let k=0;k<nWords;k++){
    const a=Math.floor(w0+(k/nWords)*(w1-w0));
    const b=Math.max(a+1,Math.floor(w0+((k+1)/nWords)*(w1-w0)));
    let eSum=0;
    for(let m=a;m<=b&&m<totalWins;m++)eSum+=Math.max(thr*0.35,env[m]);
    const sw=l.wWeights[k]*(0.45+0.55*(eSum/Math.max(1,b-a+1))/maxRms);
    segWeights.push(sw);
    sumSeg+=sw;
   }
   let curT=l.ss;
   const span=Math.max(0.22,l.se-l.ss);
   l.wTimes=segWeights.map((sw,k)=>{
    const wd=(sw/sumSeg)*span;
    const pair=[curT,k===nWords-1?l.se:curT+wd];
    curT+=wd;
    return pair;
   });
  }
 });
}

function retime(){Object.keys(S0).forEach(k=>delete S0[k]);let acc=0,pa=null,kk=0;
 L.forEach((l,idx)=>{
  l.d=LEN*l.wt/(tot||1);
  l.t0=acc;
  acc+=l.d;
  l.ss=(idx===0)?0.05:l.t0+0.06;
  l.se=l.t0+l.d*0.95;
  l.wTimes=null;
 });
 if(voBuf)alignLinesToVoAudio(voBuf);
 L.forEach(l=>{if(l[0]!==pa){pa=l[0];kk=0;S0[pa]=l.t0}l.s=kk++});
}
retime();

const RGB_CACHE={};
function rgb(c){
 if(!c||typeof c!=='string')return[255,255,255];
 const k=c.trim();
 if(RGB_CACHE[k])return RGB_CACHE[k];
 if(k[0]==='#'){
  let h=k.slice(1);
  if(h.length===3||h.length===4)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length>=6){
   const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
   if(!Number.isNaN(r)&&!Number.isNaN(g)&&!Number.isNaN(b))return RGB_CACHE[k]=[r,g,b];
  }
 }
 const m=k.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
 if(m)return RGB_CACHE[k]=[+m[1]||0,+m[2]||0,+m[3]||0];
 try{
  const d=document.createElement('canvas');d.width=d.height=1;const g=d.getContext('2d');
  g.fillStyle='#ffffff';g.fillStyle=k;g.fillRect(0,0,1,1);
  const p=g.getImageData(0,0,1,1).data;
  return RGB_CACHE[k]=[p[0],p[1],p[2]];
 }catch(_){return RGB_CACHE[k]=[255,255,255]}
}

const POSES={s:[0,0,1,2],n:[0,1,0,2,0],e:[5,1,2,5],d:[3,0,2,3]};

function vol(){const l=L[li];
 if(!playing||!l)return 0;

  let s=0;for(let i=0;i<anBuf.length;i++)s+=anBuf[i]*anBuf[i];
  const r=Math.sqrt(s/anBuf.length);
  if(r>=.012)return cl(Math.pow(r*9.5,.76),0,1);
 }
 return(tm>=l.ss&&tm<=l.se)?cl(.32+.44*Math.abs(S(A*10.5))*(.55+.45*Math.abs(S(A*4.5)))):0;
}

 CS.sway+=(targetSway-CS.sway)*mvLerp;

}

function poseXf(id,u,d){
 const e=eo(cl(u/.55)),b=bk(cl(u/.65));
 switch(id){
  case 1:return{x:322+12*(1-e),y:1295,s:1.04,r:-.035};
  case 2:return{x:398-12*(1-e),y:1295,s:1.04,r:.035};

  case 5:return{x:360+d*20,y:1292,s:1.03+.03*b,r:d*.035};
  default:return{x:360,y:1295,s:1.02,r:0};
 }
}

 char._x+=(tx-char._x)*pLerp;
 char._y+=(ty-char._y)*pLerp;

function initCharFromUrl(url){
 return new Promise(resolve=>{
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{
   const tw=440,th=440,cc=document.createElement('canvas');cc.width=tw;cc.height=th;
   const cx=cc.getContext('2d',{willReadFrequently:true});
   const sc0=Math.min(tw/im.width,th/im.height),dw=im.width*sc0,dh=im.height*sc0,ox=(tw-dw)/2,oy=(th-dh)/2;
   cx.drawImage(im,ox,oy,dw,dh);
   const p=cx.getImageData(0,0,tw,th).data;
   let a=tw,b=0,c=th,d=0;
   for(let y=0;y<th;y++)for(let x=0;x<tw;x++)if(p[(y*tw+x)*4+3]>60){if(x<a)a=x;if(x>b)b=x;if(y<c)c=y;if(y>d)d=y}
   const fullH=(d-c)/sc0,sx=Math.max(0,(a-ox)/sc0),sy=Math.max(0,(c-oy)/sc0),sw=Math.min(im.width-sx,(b-a)/sc0),sh=Math.min(im.height-sy,fullH*HALF);
   const OW=600,OH=Math.max(120,Math.round(OW*sh/sw)),oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
   const og=oc.getContext('2d');og.imageSmoothingEnabled=true;og.imageSmoothingQuality='high';
   og.drawImage(im,sx,sy,sw,sh,0,0,OW,OH);
   const PAD=10,SW=OW+PAD*2,SH=OH+PAD*2,sc=document.createElement('canvas');sc.width=SW;sc.height=SH;
   const sg=sc.getContext('2d'),rStroke=5;
   for(let ang=0;ang<Math.PI*2;ang+=Math.PI/8)sg.drawImage(oc,PAD+Math.cos(ang)*rStroke,PAD+Math.sin(ang)*rStroke);
   sg.globalCompositeOperation='source-in';sg.fillStyle='#ffffff';sg.fillRect(0,0,SW,SH);
   cim=oc;cimStroke=sc;CS.pt=A;CS.pid=0;resolve(true);
  };
  im.onerror=()=>resolve(false);
  im.src=url;
 });
}

/* DETEKTOR KLAUSA AKTIF DI B-ROLL (MEMBACA BAGIAN KALIMAT YANG SEDANG DIUCAPKAN VO SAAT INI) */
function getActiveBrollClause(){
 const cur=L[li];
 if(!cur)return TITLE;
 const clauses=cur.t.split(/[,.;]+/).map(s=>s.trim()).filter(Boolean);
 if(clauses.length<=1)return cur.t;
 const prog=cl((tm-cur.ss)/Math.max(0.25,cur.se-cur.ss),0,0.999);
 const idx=Math.min(clauses.length-1,Math.floor(prog*clauses.length));
 return clauses[idx];
}

/* ===== BAGIAN 3: SUBTITLE AFTER EFFECTS BESAR, RAPI & SINKRON INTONASI VO ===== */
function activeWordIdx(l){
 if(!l||!l.w||!l.w.length)return-1;
 if(tm<l.ss)return-1;
 if(tm>l.se)return l.w.length-1;
 if(l.wTimes&&l.wTimes.length===l.w.length){
  for(let i=0;i<l.wTimes.length;i++){
   if(tm>=l.wTimes[i][0]&&tm<=l.wTimes[i][1])return i;
  }
 }
 const dur=Math.max(0.18,l.se-l.ss);
 const elapsed=cl((tm-l.ss)/dur,0,0.9999);
 const targetWt=elapsed*l.wWeightSum;
 let acc=0;
 for(let i=0;i<l.w.length;i++){
  acc+=l.wWeights[i];
  if(targetWt<=acc)return i;
 }
 return l.w.length-1;
}

function buildCharDynamicSub(l){
 const words=l.w;
 const out=[];
 let wIdx=0,pageId=0;
 while(wIdx<words.length){
  const pageSlice=words.slice(wIdx,wIdx+4);
  const splitAt=pageSlice.length>2?Math.ceil(pageSlice.length/2):pageSlice.length;
  const rows=[pageSlice.slice(0,splitAt),pageSlice.slice(splitAt)].filter(r=>r.length>0);

  rows.forEach((rowSlice,rowIdx)=>{
   const rowFont=AE_FONTS[(SEED+li+pageId+rowIdx)%AE_FONTS.length];
   const items=rowSlice.map((w,k)=>{
    const ff=w.em?AE_EM_FONT:rowFont;
    const fWeight=w.em?'italic 900':'900';
    const sz=w.em?54:48;
    X.font=`${fWeight} ${sz}px ${ff}`;
    const ww=X.measureText(w.s).width;
    return{s:w.s,em:w.em,idx:wIdx+(rowIdx===0?k:splitAt+k),ww,ff,fWeight,sz};
   });
   const totalSlotW=items.reduce((acc,it)=>acc+Math.ceil(it.ww*1.12)+18,0);
   const fitScale=totalSlotW>440?(440/totalSlotW):1;
   let xCursor=38;
   items.forEach(it=>{
    const adjSz=Math.max(30,Math.round(it.sz*fitScale));
    X.font=`${it.fWeight} ${adjSz}px ${it.ff}`;
    const adjW=X.measureText(it.s).width;
    const slotW=Math.ceil(adjW*1.12)+18;
    out.push({...it,sz:adjSz,ww:adjW,slotW,row:rowIdx,x:xCursor,pageId});
    xCursor+=slotW;
   });
  });
  wIdx+=pageSlice.length;
  pageId++;
 }
 return out;
}

function buildBrollSingleLine(l,maxW){
 const words=l.w;
 const pages=[];
 let cur=[],cw=0;
 words.forEach((w,idx)=>{
  const sz=w.em?36:34;
  const fWeight=w.em?'900':'800';
  X.font=`${fWeight} ${sz}px ${SANS}`;
  const ww=X.measureText(w.s).width;
  const slotW=Math.ceil(ww*1.08)+14;
  if(cur.length>0&&cw+slotW>maxW){
   pages.push(cur);
   cur=[];cw=0;
  }
  cur.push({s:w.s,em:w.em,idx,ww,slotW,sz,fWeight});
  cw+=slotW;
 });
 if(cur.length)pages.push(cur);

 const out=[];
 pages.forEach((pg,pageId)=>{
  const totalW=pg.reduce((a,b)=>a+b.slotW,0);
  let xCursor=360-totalW/2;
  pg.forEach(it=>{
   out.push({...it,x:xCursor,pageId,totalW});
   xCursor+=it.slotW;
  });
 });
 return out;
}

function drawSubs(){
 if(cvL>0.35)return;
 const l=L[li];if(!l)return;
 const sc=l[0];
 const isCharSpeakingOnly=(sc==='title'||sc==='a'||sc==='c'||sc==='end');
 const aw=activeWordIdx(l);
 if(aw<0)return;

 const voicePulse=CS.speaking?(1+CS.energy*0.09):1.0;

 if(isCharSpeakingOnly){
  if(lay!==li*2+1){cap=buildCharDynamicSub(l);lay=li*2+1}
  if(!cap.length)return;

  const activeItem=cap.find(it=>it.idx===aw)||cap[cap.length-1];
  const currentPage=activeItem.pageId;
  const baseY=126;
  const lineH=68;

  X.save();
  cap.forEach(item=>{
   if(item.pageId!==currentPage||item.idx>aw)return;
   const act=(item.idx===aw);
   const wStart=(l.wTimes&&l.wTimes[item.idx])?l.wTimes[item.idx][0]:l.ss;
   const pop=eo(cl((tm-wStart)/0.13));

   // 4 Variasi Motion After Effects berbeda per video
   let scWord=1,yOff=0,xOff=0,rot=0;
   if(AE_STYLE===0){
    scWord=(0.82+0.18*pop)*(act?(1.08*voicePulse):1.0);
    yOff=(1-pop)*12-(act?4:0);
   }else if(AE_STYLE===1){
    scWord=act?(1.07*voicePulse):1.0;
    yOff=(1-pop)*24;
   }else if(AE_STYLE===2){
    scWord=(0.75+0.25*bk(pop))*(act?(1.06*voicePulse):1.0);
    rot=act?Math.sin(A*12)*0.02:0;
   }else{
    scWord=act?(1.08*voicePulse):1.0;
    xOff=(1-pop)*-18;
   }

   X.save();
   X.translate(item.x+xOff,baseY+item.row*lineH+yOff);
   X.rotate(rot);
   X.scale(scWord,scWord);
   X.globalAlpha=0.35+0.65*pop;

   // Pill highlight belakang kata aktif pada gaya AE tertentu
   if(act&&(AE_STYLE===1||AE_STYLE===3)){
    X.fillStyle='rgba(15,23,42,0.88)';
    rr(-8,-item.sz*0.56,item.ww+16,item.sz*1.12,12);
    X.fill();
   }

   X.font=`${item.fWeight} ${item.sz}px ${item.ff}`;
   X.textAlign='left';X.textBaseline='middle';X.lineJoin='round';
   X.lineWidth=6.0;X.strokeStyle='rgba(8,12,20,0.96)';
   X.strokeText(item.s,0,0);
   X.fillStyle=act?P.a:(item.em?'#fde047':'#ffffff');
   X.fillText(item.s,0,0);
   X.restore();
  });
  X.restore();
 }else{
  if(lay!==li*2+2){cap=buildBrollSingleLine(l,600);lay=li*2+2}
  if(!cap.length)return;

  const activeItem=cap.find(it=>it.idx===aw)||cap[cap.length-1];
  const currentPage=activeItem.pageId;
  const lineItems=cap.filter(it=>it.pageId===currentPage&&it.idx<=aw);
  if(!lineItems.length)return;

  const allPageItems=cap.filter(it=>it.pageId===currentPage);
  const boxW=Math.min(640,Math.max(220,allPageItems[0].totalW+48));
  const boxX=360-boxW/2;
  const y=SUBY;

  X.save();
  X.fillStyle='rgba(15,23,42,0.92)';
  rr(boxX,y-32,boxW,64,20);
  X.fill();
  X.strokeStyle=P.a;X.lineWidth=2.5;
  rr(boxX,y-32,boxW,64,20);
  X.stroke();

  lineItems.forEach(item=>{
   const act=(item.idx===aw);
   X.font=`${item.fWeight} ${item.sz}px ${SANS}`;
   X.textAlign='left';X.textBaseline='middle';X.lineJoin='round';
   X.lineWidth=4.5;X.strokeStyle='rgba(8,12,20,0.95)';
   X.strokeText(item.s,item.x,y-(act?2:0));
   X.fillStyle=act?P.a:'#ffffff';
   X.fillText(item.s,item.x,y-(act?2:0));
  });
  X.restore();
 }
}

function drawTransition(){

 if(dt<0||dt>0.24)return;

/* ---------- MESIN AUDIO ---------- */
let ac=null,dest=null,gainM=null,gainBgm=null,gainVo=null,gainSfx=null;
function initAudio(){
 if(ac){if(ac.state==='suspended')ac.resume().catch(()=>{});return}
 const AC=window.AudioContext||window.webkitAudioContext;
 ac=new AC();
 dest=ac.createMediaStreamDestination();
 gainM=ac.createGain();gainM.gain.value=1.0;
 gainBgm=ac.createGain();gainBgm.gain.value=0.14;
 gainSfx=ac.createGain();gainSfx.gain.value=0.85;
 gainVo=ac.createGain();gainVo.gain.value=1.25;
 gainBgm.connect(gainM);
 gainSfx.connect(gainM);
 gainVo.connect(gainM);
 gainM.connect(ac.destination);
 gainM.connect(dest);
 an=ac.createAnalyser();an.fftSize=512;anBuf=new Float32Array(an.fftSize);
 gainVo.connect(an);
}

function sfxTransition(dir=1){
 if(!ac)return;
 const t=ac.currentTime;
 const o1=ac.createOscillator(),g1=ac.createGain();
 o1.type='sine';
 o1.frequency.setValueAtTime(dir>0?190:320,t);
 o1.frequency.exponentialRampToValueAtTime(dir>0?620:220,t+0.19);
 g1.gain.setValueAtTime(0.001,t);
 g1.gain.linearRampToValueAtTime(0.20,t+0.04);
 g1.gain.exponentialRampToValueAtTime(0.001,t+0.21);
 o1.connect(g1);g1.connect(gainSfx);
 o1.start(t);o1.stop(t+0.22);
}

function sfx(k){
 if(!ac||!k)return;
 const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 o.connect(g);g.connect(gainSfx);
 if(k==='b'){o.type='sine';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(38,t+.34);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.001,t+.36);o.start(t);o.stop(t+.38)}
 else if(k==='k'){o.type='triangle';o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(52,t+.18);g.gain.setValueAtTime(.26,t);g.gain.exponentialRampToValueAtTime(.001,t+.20);o.start(t);o.stop(t+.22)}
 else if(k==='c'){o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+.08);g.gain.setValueAtTime(.20,t);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.start(t);o.stop(t+.44)}
 else if(k==='p'){o.type='sine';o.frequency.setValueAtTime(540,t);o.frequency.exponentialRampToValueAtTime(820,t+.09);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.10);o.start(t);o.stop(t+.11)}
 else if(k==='w'){sfxTransition(1)}
}

let bgmStep=0;
function bgmTick(){
 if(!ac||!playing||ac.currentTime<mNext)return;
 const notes=G_SPEC.bgm;
 const f=notes[bgmStep%notes.length];
 const t=ac.currentTime;

 const o=ac.createOscillator(),g=ac.createGain();
 o.type='sine';
 o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(0.001,t);
 g.gain.linearRampToValueAtTime(0.16,t+0.07);
 g.gain.exponentialRampToValueAtTime(0.001,t+0.62);
 o.connect(g);g.connect(gainBgm);
 o.start(t);o.stop(t+0.64);

 bgmStep++;
 mNext=t+0.52;
}

function stopVoNode(){if(voSrc){try{voSrc.stop();voSrc.disconnect()}catch(_){}voSrc=null}}
function startVoFrom(offset){
 stopVoNode();
 const off=voBuf?cl(offset,0,Math.max(0,voBuf.duration-.02)):offset;
 voStartOffset=off;
 voWallT0=performance.now();
 if(!ac||!voBuf)return;
 voSrc=ac.createBufferSource();
 voSrc.buffer=voBuf;
 voSrc.connect(gainVo);
 voSrc.start(0,off);
 voStartCtxT=ac.currentTime;
}

/* ---------- render utama ---------- */
let prevCvVisible=true;
function render(ts){
 if(!last)last=ts;
 DT=cl((ts-last)/1000,.001,.05);last=ts;now=ts/1000;
 if(playing){
  if(voBuf&&voSrc&&ac&&ac.state==='running'&&ac.currentTime>voStartCtxT+0.01){
   tm=voStartOffset+(ac.currentTime-voStartCtxT);
  }else if(voWallT0>0){
   tm=voStartOffset+(performance.now()-voWallT0)/1000;
  }else{
   tm+=DT;
  }
  if(tm>=LEN){
   tm=LEN;playing=false;stopVoNode();updatePlayIcon();
   if(exporting)finishExport();
  }
  if(tm<COVER_HOLD){
   cvL=1;
  }else{
   cvL=Math.max(0,cvL-DT*2.2);
  }
 }else{
  if(tm<=0.01)cvL=1;
 }
 const cvVisible=(cvL>0.02);
 if(prevCvVisible&&!cvVisible){
  trT=now;
  if(playing)sfxTransition(1);
 }
 prevCvVisible=cvVisible;

 A+=DT*SPD;
 const nli=lineAt(tm);
 if(nli!==li){
  li=nli;lay=-1;
  const sc=L[li]?L[li][0]:'a';
  if(sc!==pScene){
   pScene=sc;
   if(!cvVisible){
    trT=now;
    if(playing)sfxTransition((li%2===0)?1:-1);
   }
  }
  if(playing&&spoken!==li){spoken=li;if(L[li]&&L[li][3])sfx(L[li][3])}
 }
 charTick();
 if(playing)bgmTick();

 X.save();X.scale(SX,SY);
 const sc=L[li]?L[li][0]:'title';
 if(cvVisible){
  if(cvL<0.99&&SCN[sc]){
   SCN[sc](Math.max(0,tm-(L[li]?L[li].t0:0)));
  }
  X.save();
  const zOut=1+(1-cvL)*0.05;
  X.translate(360,640);X.scale(zOut,zOut);X.translate(-360,-640);
  X.globalAlpha=cvL;
  SCN.cover(A);
  X.restore();
 }else if(SCN[sc]){
  SCN[sc](Math.max(0,tm-(L[li]?L[li].t0:0)));
 }
 drawTransition();
 drawSubs();
 X.drawImage(ov,0,0);
 X.restore();

 $('pg').style.width=(cl(tm/LEN)*100)+'%';
 const m=Math.floor(tm/60),s=Math.floor(tm%60);
 $('clk').textContent=m+':'+(s<10?'0':'')+s;
 requestAnimationFrame(render);
}

 X.restore();
};

async function initAutoAssetsAndRender(){
 await FONTS_READY;
 await initCharSafe('karakter.png');
 try{
  const resp = await fetch('vo.mp3');
  if(resp.ok){
   const buf = await resp.arrayBuffer();
   const AC = window.AudioContext || window.webkitAudioContext;
   const tempAc = new AC();
   voBuf = await tempAc.decodeAudioData(buf.slice(0));
   LEN = Math.ceil(voBuf.duration) + 1;
   retime();
   tempAc.close().catch(()=>{});
  }
 }catch(e){console.error(e)}
 window.__VIDEO_LEN = LEN;
 window.__ASSETS_READY = true;
 if(!window.__SERVER_MODE){
  requestAnimationFrame(render);
 }
}

window.addEventListener('load', initAutoAssetsAndRender);
</script>
