html,body{height:100%}
body{background:var(--ink);color:var(--txt);font-family:Poppins,system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px))}

.poster p{font-weight:700;font-size:15px;letter-spacing:.14em;background:rgba(10,16,24,.78);padding:5px 14px;border-radius:20px}
.bar{display:flex;align-items:center;gap:8px;width:100%}
.btn{height:38px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:600 12px Poppins,sans-serif;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.go{background:#e0b877;border-color:#e0b877;color:#1a1208}
.btn.rec{animation:rc 1.2s infinite}
@keyframes rc{50%{opacity:.55}}
.play{width:44px;height:44px;border-radius:50%;background:var(--txt);border:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.play svg{width:18px;height:18px}
.sp{flex:1}
.clk{font:600 12px Poppins,sans-serif;color:#7d909a;text-align:center}
.tl{position:relative;width:100%;height:9px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden;flex-shrink:0}
.tl b{position:absolute;left:0;top:0;bottom:0;width:0;background:#e0b877}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;background:rgba(10,14,20,.94);border:1px solid rgba(255,255,255,.18);font-size:12.5px;font-weight:600;line-height:1.4;padding:9px 14px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}

function bestPixabayVideoUrl(h){
 const v=h.videos||{};
 const c=['large','medium','small','tiny'].map(k=>v[k]).filter(x=>x&&x.url);
 if(!c.length)return '';
 /* pilih yang paling dekat 1080p (cukup tajam untuk 9:16 1280px, tidak seberat 4K) */
 const pen=x=>{const hh=Number(x.height)||0;if(!hh)return 5000;return hh>=1080?(hh-1080):(1080-hh)*3};
 c.sort((a,b)=>pen(a)-pen(b));
 return c[0].url;
}

async function fetchPixabayMedia(query,variantIdx=0){
 if(!PIXABAY_KEY)return{videoUrl:'',photoUrl:''};
 const cacheKey=query.toLowerCase().trim();
 let vUrls=VIDEO_QUERY_CACHE[cacheKey]||null;
 let pUrls=PHOTO_QUERY_CACHE[cacheKey]||null;
 const base='key='+encodeURIComponent(PIXABAY_KEY)+'&q='+encodeURIComponent(query)+'&safesearch=true&per_page=20';

 if(!vUrls){
  vUrls=[];
  for(const extra of ['&min_width=1920&min_height=1080','&min_width=1280&min_height=720','']){
   try{
    const res=await fetch('https://pixabay.com/api/videos/?'+base+extra);
    const json=res.ok?await res.json():{hits:[]};
    const hits=(json.hits||[]).slice().sort((a,b)=>((b.duration>=6)-(a.duration>=6)));
    vUrls=hits.map(bestPixabayVideoUrl).filter(Boolean);
   }catch(_){vUrls=[]}
   if(vUrls.length>=2)break;
  }
  VIDEO_QUERY_CACHE[cacheKey]=vUrls;
 }
 if(!pUrls){
  pUrls=[];
  for(const extra of ['&min_width=1080','']){
   try{
    const res=await fetch('https://pixabay.com/api/?'+base+'&image_type=photo'+extra);
    const json=res.ok?await res.json():{hits:[]};
    pUrls=(json.hits||[]).map(h=>h.largeImageURL||h.webformatURL||'').filter(Boolean);
   }catch(_){pUrls=[]}
   if(pUrls.length>=2)break;
  }
  PHOTO_QUERY_CACHE[cacheKey]=pUrls;
 }
 return{
  videoUrl:vUrls.length?vUrls[variantIdx%vUrls.length]:'',
  photoUrl:pUrls.length?pUrls[variantIdx%pUrls.length]:''
 };
}

function attachPhotoToItem(item,imgUrl){
 return new Promise(resolve=>{
  if(!imgUrl)return resolve(false);
  const im=new Image();
  if(/^https?:\/\//i.test(imgUrl))im.crossOrigin='anonymous';
  const timer=setTimeout(()=>resolve(false),10000);
  im.onload=()=>{
   clearTimeout(timer);
   item.photoEl=im;
   item.photoReady=true;
   resolve(true);
  };
  im.onerror=()=>{clearTimeout(timer);resolve(false)};
  im.src=imgUrl;
 });
}

function attachVideoElementToItem(item,mp4Url){
 return new Promise(resolve=>{
  if(!mp4Url)return resolve(false);
  try{
   const v=document.createElement('video');
   if(/^https?:\/\//i.test(mp4Url))v.crossOrigin='anonymous';
   v.muted=true;
   v.loop=true;
   v.playsInline=true;
   v.preload='auto';
   v.src=mp4Url;
   const timer=setTimeout(()=>resolve(v.readyState>=2),20000);
   const markReady=()=>{
    if(item.videoReady)return;
    clearTimeout(timer);
    item.videoEl=v;
    item.videoReady=true;
    resolve(true);
   };
   v.oncanplay=markReady;
   v.onloadeddata=markReady;
   v.onerror=()=>{clearTimeout(timer);resolve(false)};
   v.load();
  }catch(_){resolve(false)}
 });
}

async function preloadOneItem(item,idx){
 if(!item||item.borrowPrev)return;

 // Prioritas utama: frame sequence hasil ekstraksi FFmpeg (stabil di Chromium Headless)
 if(Array.isArray(item.videoFrames)&&item.videoFrames.length>0){
  const loadedImgs=await Promise.all(item.videoFrames.map(src=>new Promise(res=>{
   const im=new Image();
   im.onload=()=>res(im);
   im.onerror=()=>res(null);
   im.src=src;
  })));
  item.frameImgs=loadedImgs.filter(Boolean);
  if(item.frameImgs.length>0){
   item.videoReady=true;
   updateApiBtnLabel();
   return;
  }
 }

 let vUrl=item.videoUrl;
 let pUrl=item.photoUrl;

 if(!vUrl&&!pUrl&&PIXABAY_KEY&&!item.noMedia){
  const found=await fetchPixabayMedia(item.videoQuery,Math.max(0,idx));
  vUrl=found.videoUrl;
  pUrl=found.photoUrl;

  item.photoUrl=pUrl;
 }

 let ok=false;
 if(vUrl)ok=await attachVideoElementToItem(item,vUrl);
 if(!ok&&pUrl)ok=await attachPhotoToItem(item,pUrl);
 updateApiBtnLabel();
}

 need.forEach((mt,v)=>{

   const relT=Math.max(0,mt)%v.duration;
   if(!playing||Math.abs(v.currentTime-relT)>0.4){try{v.currentTime=relT}catch(_){}}
  }
  if(playing&&v.paused)v.play().catch(()=>{});
  if(!playing&&!v.paused)v.pause();
 });
 prep.forEach((mt,v)=>{
  if(!v.paused)v.pause();
  if(v.duration&&Number.isFinite(v.duration)&&Math.abs(v.currentTime-mt)>0.5){try{v.currentTime=mt}catch(_){}}
 });

 });
}

function tok(str){const out=[];str.split('*').forEach((part,i)=>{if(!part)return;const em=i%2==1;

function calcWordWeights(words){
 return words.map((w)=>{
  const clean=w.s.replace(/[^a-zA-Z0-9\u00C0-\u024F\u3040-\u9fff]/g,'');
  const vowels=(clean.match(/[aiueoAIUEO]/g)||[]).length;
  let wt=Math.max(1.8,clean.length*0.55+vowels*0.50);
  if(/[,;:]$/.test(w.s))wt+=1.4;
  if(/[.?!。！？…]$/.test(w.s))wt+=2.0;
  if(w.em)wt*=1.04;
  return wt;
 });
}

function applyExactElevenLabsTimings(){
 if(!LINE_TIMINGS || LINE_TIMINGS.length !== NL) return false;

  L[idx].t0 = (idx === 0) ? COVER_HOLD : Math.max(COVER_HOLD, realStart - 0.04);

 }

function detectIslands(env,totalWins,stepSec,thr,minSil){
 const out=[];let inSp=false,s0=0,sil=0;
 for(let i=0;i<totalWins;i++){
  if(env[i]>=thr){if(!inSp){inSp=true;s0=i}sil=0}
  else if(inSp){sil++;if(sil>=minSil){out.push({start:s0*stepSec,end:(i-sil+1)*stepSec});inSp=false;sil=0}}
 }
 if(inSp)out.push({start:s0*stepSec,end:totalWins*stepSec});
 return out.filter(x=>x.end-x.start>=.06);
}

function alignLinesToVoAudio(audioBuffer){
 if(!audioBuffer||!NL)return;
 const data=audioBuffer.getChannelData(0);
 const sr=audioBuffer.sampleRate;
 const stepSec=0.010;
 const winSize=Math.max(1,Math.floor(sr*stepSec));
 const totalWins=Math.floor(data.length/winSize);
 if(totalWins<20)return;
 const env=new Float32Array(totalWins);
 let maxRms=0.001;
 for(let i=0;i<totalWins;i++){
  let sum=0;const base=i*winSize;
  for(let j=0;j<winSize;j++){const v=data[base+j];sum+=v*v}
  const rms=Math.sqrt(sum/winSize);env[i]=rms;if(rms>maxRms)maxRms=rms;
 }
 const thr=maxRms*0.055;
 let islands=[];
 for(const minSil of [22,16,12,9,6]){
  islands=detectIslands(env,totalWins,stepSec,thr,minSil);
  if(islands.length-1>=NL-1)break;
 }
 if(!islands.length)return;
 const speechFirst=islands[0].start,speechLast=islands[islands.length-1].end;
 const activeSpan=Math.max(1.0,speechLast-speechFirst);
 const pauseCuts=[];
 for(let k=0;k<islands.length-1;k++){
  pauseCuts.push({mid:(islands[k].end+islands[k+1].start)*0.5,prevEnd:islands[k].end,nextStart:islands[k+1].start,dur:islands[k+1].start-islands[k].end});
 }
 const ideal=[speechFirst];
 let accWt=0;
 for(let i=0;i<NL;i++){accWt+=L[i].wt;ideal.push(speechFirst+(accWt/(tot||1))*activeSpan)}
 const K=NL-1;
 const cuts=[];
 let lastUsedIdx=-1;
 for(let k=1;k<=K;k++){
  const targetT=ideal[k];
  let bestIdx=-1,bestScore=1e9;
  for(let j=lastUsedIdx+1;j<pauseCuts.length;j++){
   const d=Math.abs(pauseCuts[j].mid-targetT);
   if(d<1.35&&d<bestScore){bestScore=d;bestIdx=j}
  }
  if(bestIdx!==-1){cuts.push(pauseCuts[bestIdx]);lastUsedIdx=bestIdx}
  else cuts.push({mid:targetT,prevEnd:targetT-0.02,nextStart:targetT+0.02,dur:0.04});
 }
 for(let idx=0;idx<NL;idx++){
  const prevCut=idx>0?cuts[idx-1]:null;
  const nextCut=idx<NL-1?cuts[idx]:null;
  const cStart=prevCut?prevCut.nextStart:speechFirst;
  const cEnd=nextCut?nextCut.prevEnd:speechLast;
  const lead=prevCut?Math.min(0.18,prevCut.dur*0.5):0;
  L[idx].t0=idx===0?COVER_HOLD:Math.max(COVER_HOLD,COVER_HOLD+(prevCut.nextStart-lead));
  L[idx].ss=COVER_HOLD+cStart;
  L[idx].se=COVER_HOLD+Math.max(cStart+0.25,cEnd);
 }
}

 });

 if(!playing||!l||tm<COVER_HOLD)return 0;
 if(an&&voSrc){
  an.getFloatTimeDomainData(anBuf);
  let s=0;for(let i=0;i<anBuf.length;i++)s+=anBuf[i]*anBuf[i];
  const r=Math.sqrt(s/anBuf.length);
  if(r>=.012)return cl(Math.pow(r*9.5,.76),0,1);
 }
 return(tm>=l.ss&&tm<=l.se)?cl(.36+.46*Math.abs(S(A*11.5))*(.55+.45*Math.abs(S(A*4.8)))):0;
}

function charTick(){
 const l=L[li];if(!l)return;
 if(CS.li!==li){
  CS.li=li;
  const arr=POSES[l[1]]||POSES.n;
  CS.pid=(li===0)?0:arr[li%arr.length];
  CS.pt=A;CS.dir=(li%2===0)?1:-1;
  CS.reactSide=(li%2===0)?-1:1;
 }
 const rawMv=vol();
 CS.energy=rawMv;CS.speaking=rawMv>.022;
 const mAlpha=rawMv>CS.mv?(1-Math.pow(.00005,DT)):(1-Math.pow(.001,DT));
 CS.mv+=(rawMv-CS.mv)*mAlpha;
 const aw=activeWordIdx(l);
 const wd=aw>=0?l.w[aw]:null;
 const e0=(wd&&wd.em)?1:0;
 CS.ev+=((playing?e0:0)-CS.ev)*(1-Math.pow(.02,DT));
 CS.breath=S(A*2.4)*0.014;
 CS.nod+=((playing?(CS.ev*8+CS.mv*3.5):0)-CS.nod)*(1-Math.pow(.008,DT));
 const amp={e:1.25,d:1.10,s:.70}[l[1]]||0.95;
 const mvLerp=1-Math.pow(.005,DT);
 CS.tilt+=((playing?((S(A*2.1)*.028+S(A*3.6)*.012)*amp*(CS.speaking?1:.35)):S(A*.7)*.010)-CS.tilt)*mvLerp;
 CS.sway+=((playing?((S(A*1.6)*7+S(A*3.0)*3.0)*amp*(CS.speaking?1:.4)):S(A*.65)*2.0)-CS.sway)*mvLerp;
 CS.bounce+=((playing?(CS.mv*14*amp+CS.ev*8):0)-CS.bounce)*mvLerp;
}

function poseXf(id,u,d){
 const e=eo(cl(u/.55)),b=bk(cl(u/.65));
 switch(id){

 }
}

function char(o={}){
 if(!cim)return;
 const u=Math.max(0,A-CS.pt);
 const isReact=Boolean(o.react);
 const l=L[li];
 const mood=l?l[1]:'n';
 const p=poseXf(CS.pid,u,CS.dir);

 const targetX=isReact?(360+CS.reactSide*95+(o.ox||0)):(p.x+(o.ox||0));
 const targetY=isReact?(1320+(o.oy||0)):(p.y+(o.oy||0));
 const targetS=p.s*(o.sc||1);
 const lookUpTilt=isReact?(-CS.reactSide*0.095-CS.ev*0.04):0;
 const targetR=p.r+lookUpTilt;

 const pLerp=1-Math.pow(.001,DT);
 if(!char._x){char._x=targetX;char._y=targetY;char._s=targetS;char._r=targetR}
 char._x+=(targetX-char._x)*pLerp;
 char._y+=(targetY-char._y)*pLerp;
 char._s+=(targetS-char._s)*pLerp;
 char._r+=(targetR-char._r)*pLerp;

 const talk=(playing&&CS.speaking)?CS.mv:0;
 const popPulse=Math.sin(cl(u/0.35)*Math.PI)*0.028;
 const reactNod=isReact?(Math.sin(A*6.8)*4.5+CS.ev*10):0;
 const x=char._x+CS.sway*(isReact?0.55:1)+S(A*1.9)*talk*2.2;
 const y=char._y-CS.bounce+CS.nod+reactNod+S(A*2.0)*3.5;
 const sx=char._s*(1+CS.mv*0.024-CS.breath*0.5+popPulse);
 const sy=char._s*(1+CS.mv*0.028+CS.breath+popPulse);
 const r=char._r+CS.tilt*(isReact?0.6:1)+S(A*3.9+1.3)*talk*0.007;

 let DW=550,DH=DW*cim.height/cim.width;
 if(DH>720){DH=720;DW=DH*cim.width/cim.height}

 X.save();
 X.globalAlpha*=(o.a==null?1:o.a);
 X.translate(x,y);X.rotate(r);
 const flipX=(isReact&&CS.reactSide>0)?-1:1;
 X.scale(sx*flipX,sy);
 const q=DW/cim.width;
 if(cimStroke)X.drawImage(cimStroke,-DW/2-10*q,-DH-10*q,cimStroke.width*q,cimStroke.height*q);
 X.drawImage(cim,-DW/2,-DH,DW,DH);

 if(isReact){
  const bx=x+(-CS.reactSide*145);
  const by=y-DH*char._s*0.74;
  drawReactionBadge(bx,by,mood,u);
 }
}

function initCharFromUrl(url){

  if(/^https?:\/\//i.test(url))im.crossOrigin='anonymous';
  im.onload=()=>{
   const tw=440,th=440,cc=document.createElement('canvas');cc.width=tw;cc.height=th;

   const sc0=Math.min(tw/im.width,th/im.height),dw=im.width*sc0,dh=im.height*sc0,ox=(tw-dw)/2,oy=(th-dh)/2;
   cx.drawImage(im,ox,oy,dw,dh);
   const p=cx.getImageData(0,0,tw,th).data;
   let a=tw,b=0,c=th,d=0;
   for(let y=0;y<th;y++)for(let x=0;x<tw;x++)if(p[(y*tw+x)*4+3]>60){if(x<a)a=x;if(x>b)b=x;if(y<c)c=y;if(y>d)d=y}
   const fullH=(d-c)/sc0,sx=Math.max(0,(a-ox)/sc0),sy=Math.max(0,(c-oy)/sc0),sw=Math.min(im.width-sx,(b-a)/sc0),sh=Math.min(im.height-sy,fullH*HALF);
   const OW=600,OH=Math.max(120,Math.round(OW*sh/sw)),oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
   const og=oc.getContext('2d');og.imageSmoothingEnabled=true;og.imageSmoothingQuality='high';
   og.drawImage(im,sx,sy,sw,sh,0,0,OW,OH);
   const PAD=10,SW=OW+PAD*2,SH=OH+PAD*2,sc=document.createElement('canvas');sc.width=SW;sc.height=SH;
   const sg=sc.getContext('2d'),rStroke=5;
   for(let ang=0;ang<Math.PI*2;ang+=Math.PI/8)sg.drawImage(oc,PAD+Math.cos(ang)*rStroke,PAD+Math.sin(ang)*rStroke);

   cim=oc;cimStroke=sc;CS.pt=A;CS.pid=0;resolve(true);
  };
  im.onerror=()=>resolve(false);
  im.src=url;
 });

/* ============================================================================
   V52 — MESIN PANGGUNG TERPADU
   Tujuan: b-roll tidak lagi terlihat "memisah" (satu dunia visual yang menyatu),
   resolusi klip dijaga, sampul menyesuaikan judul, tampilan elegan & tidak pasaran.
   - Cross-dissolve antar baris (klip lama tetap jalan di bawah klip baru)
   - Frame morph: pip <-> layar penuh bergerak halus (bukan loncat layout)
   - Backdrop ambient dari klip itu sendiri (bukan gradasi polos)
   - Grading warna seragam (tint aksen, vignette, grain film) agar semua klip satu look
   - Sampul memakai visual klip + partikel sesuai genre judul
   Pengaturan opsional di DATA: fxLevel (0 ringan, 1 sedang, 2 penuh), disclosure,
   coverQuery / coverVideoUrl / coverPhotoUrl / coverFrames (visual sampul khusus).
   ============================================================================ */
const FX_LEVEL=(DATA.fxLevel!=null&&Number.isFinite(+DATA.fxLevel))?+DATA.fxLevel:2;
const XF=0.42,MORPH=0.55;
const FRM_PIP={x:60,y:178,w:600,h:350,r:28};
const FRM_FULL={x:0,y:0,w:720,h:1280,r:0};
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const CAN_LS=('letterSpacing' in X);
const DISCLOSURE=(DATA.disclosure!==undefined)?String(DATA.disclosure):'Visual ilustrasi (stok)';

function lerpRect(a,b,m){return{x:lerp(a.x,b.x,m),y:lerp(a.y,b.y,m),w:lerp(a.w,b.w,m),h:lerp(a.h,b.h,m),r:lerp(a.r,b.r,m)}}
function modeIsPip(idx){
 const l=L[idx];if(!l)return false;
 const sc=l[0];if(sc==='end')return false;
 const it=LINE_BROLL_MAP[idx];
 return sc==='title'||sc==='a'||sc==='c'||Boolean(it&&it.mode==='pip_broll');
}
function rectFor(idx){return(idx>=0&&modeIsPip(idx))?FRM_PIP:FRM_FULL}
function stageRectAt(idx,tIn){
 const cur=rectFor(idx),prev=rectFor(idx-1);
 if(cur===prev)return cur;
 return lerpRect(prev,cur,eio(cl(tIn/MORPH)));
}
const pipness=r=>1-cl((r.w-FRM_PIP.w)/(W-FRM_PIP.w));

/* ---------- Resolusi item media per baris ---------- */
const hasMedia=x=>Boolean(x&&((x.frameImgs&&x.frameImgs.length>0)||x.videoReady||x.photoReady));
function spanOf(bi){
 if(bi<0)return{t0:0,d:COVER_HOLD};
 const l=L[bi];if(!l)return{t0:0,d:1};
 return bi===0?{t0:0,d:l.t0+l.d}:{t0:l.t0,d:l.d};
}
function borrowFrom(direct,x){
 return Object.assign({},direct||x,{bi:x.bi,frameImgs:x.frameImgs,videoFps:x.videoFps,videoEl:x.videoEl,videoReady:x.videoReady,photoEl:x.photoEl,photoReady:x.photoReady,noMedia:false});
}
function resolveBroll(idx){
 const direct=LINE_BROLL_MAP[idx];
 if(direct&&direct.noMedia)return direct;
 if(direct&&!direct.borrowPrev&&hasMedia(direct))return direct;
 // pinjam klip terdekat sebelumnya supaya adegan berlanjut (bukan klip acak)
 for(let k=idx-1;k>=0;k--){const x=LINE_BROLL_MAP[k];if(x&&!x.noMedia&&!x.borrowPrev&&hasMedia(x))return borrowFrom(direct,x)}
 for(let k=idx+1;k<NL;k++){const x=LINE_BROLL_MAP[k];if(x&&!x.noMedia&&!x.borrowPrev&&hasMedia(x))return borrowFrom(direct,x)}
 return direct||detectVisualFromVoScript(L[idx]?L[idx].t:TITLE,'',idx,'b1');
}
function prevMedia(idx){
 if(idx<=0)return(COVER_ITEM&&hasMedia(COVER_ITEM))?COVER_ITEM:null;
 const p=resolveBroll(idx-1);
 return hasMedia(p)?p:null;
}
const mtOf=item=>tm-spanOf(item.bi).t0;
const progOf=item=>{const s=spanOf(item.bi);return cl((tm-s.t0)/Math.max(.3,s.d))};

/* ---------- Sumber gambar: frame sequence (ping-pong + blend), video, foto ---------- */
function pickSource(item,mt){
 if(!item)return null;
 if(item.frameImgs&&item.frameImgs.length>0){
  const n=item.frameImgs.length,fps=item.videoFps||15;
  if(n===1){const a=item.frameImgs[0];return{list:[[a,1]],mw:a.naturalWidth||720,mh:a.naturalHeight||1280}}
  const span=n-1,cyc=(Math.max(0,mt)*fps)%(span*2),p=cyc<=span?cyc:span*2-cyc;
  const i0=Math.min(span,Math.floor(p)),i1=Math.min(span,i0+1),f=p-i0;
  const a=item.frameImgs[i0],b=item.frameImgs[i1];
  return{list:(f>.05&&b!==a)?[[a,1],[b,f]]:[[a,1]],mw:a.naturalWidth||720,mh:a.naturalHeight||1280};
 }
 const v=item.videoEl;
 if(item.videoReady&&v&&v.videoWidth>0&&(v.readyState>=2||v._ok)){v._ok=true;return{list:[[v,1]],mw:v.videoWidth,mh:v.videoHeight}}
 if(item.photoReady&&item.photoEl&&item.photoEl.naturalWidth>0)return{list:[[item.photoEl,1]],mw:item.photoEl.naturalWidth,mh:item.photoEl.naturalHeight};
 return null;
}
function kbFor(bi,prog){
 const v=(((bi+3)*5+TITLE_HASH)%4+4)%4,e=eio(cl(prog));
 if(v===0)return{z:1.05+.09*e,px:0};
 if(v===1)return{z:1.14-.09*e,px:0};
 if(v===2)return{z:1.09,px:(e-.5)*2};
 return{z:1.09,px:(.5-e)*2};
}
function coverDraw(el,mw,mh,rect,zoom,px){
 const sc=Math.max(rect.w/mw,rect.h/mh)*zoom;
 const sw=rect.w/sc,sh=rect.h/sc;
 const maxPan=Math.max(0,(mw-sw)/2);
 const pan=px*Math.min(maxPan,sw*0.10);
 const sx=cl((mw-sw)/2+pan,0,Math.max(0,mw-sw));
 const sy=cl((mh-sh)/2,0,Math.max(0,mh-sh));
 X.drawImage(el,sx,sy,sw,sh,rect.x,rect.y,rect.w,rect.h);
}
function drawLayer(item,mt,rect,prog,alpha,zb){
 const s=pickSource(item,mt);if(!s)return false;
 const kb=kbFor(item.bi,prog);
 X.save();
 X.globalAlpha*=alpha;
 rr(rect.x,rect.y,rect.w,rect.h,rect.r);X.clip();
 s.list.forEach(([el,fa])=>{
  X.save();X.globalAlpha*=fa;
  try{coverDraw(el,s.mw,s.mh,rect,kb.z*(zb||1),kb.px)}catch(_){}
  X.restore();
 });
 X.restore();
 return true;
}

/* ---------- Partikel hidup sesuai genre judul ---------- */
const FXK=({kamar_mandi:'bubble',sejarah:'dust',horor:'fog',kriminal:'rain',konspirasi:'stars',bisnis:'ember',drama:'bokeh',psikologi:'bokeh',mitologi:'ember',sains:'stars',bencana:'ember',biografi:'dust',fakta:'dust'})[ACTIVE_GENRE]||'dust';
const FXP=(()=>{
 let s=(TITLE_HASH^0x9e3779b9)>>>0;
 const r=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 return Array.from({length:34},()=>({x:r()*W,y:r()*H,r:.8+r()*3.2,sp:.25+r()*1,ph:r()*6.283,k:r()}));
})();
const mod=(a,m)=>((a%m)+m)%m;
function drawGenreFX(k){
 if(k<=.02||FX_LEVEL<1)return;
 X.save();X.globalCompositeOperation='lighter';
 const M=H+120;
 FXP.forEach((p,i)=>{
  switch(FXK){

function activeWordIdx(l){
 if(!l||!l.w||!l.w.length)return-1;
 if(tm<l.ss)return-1;
 if(tm>l.se)return l.w.length-1;
 if(l.wTimes&&l.wTimes.length===l.w.length){
  for(let i=0;i<l.wTimes.length;i++){
   if(tm>=l.wTimes[i][0]&&tm<=l.wTimes[i][1])return i;
   if(i<l.wTimes.length-1&&tm>l.wTimes[i][1]&&tm<l.wTimes[i+1][0])return i;
  }
 }
 const dur=Math.max(0.18,l.se-l.ss);
 const elapsed=cl((tm-l.ss)/dur,0,0.9999);
 const targetWt=elapsed*l.wWeightSum;
 let acc=0;
 for(let i=0;i<l.w.length;i++){acc+=l.wWeights[i];if(targetWt<=acc)return i}
 return l.w.length-1;
}

  cur.push({s:w.s,em:w.em,idx,ww,slotW,sz:baseSz});cw+=slotW;
 });

function sfxTransition(dir=1){

 const flt=ac.createBiquadFilter();flt.type='bandpass';flt.Q.value=2.0;

 src.connect(flt);flt.connect(g);g.connect(gainSfx);

}

 X.clearRect(0,0,W,H);
 const fn=SCN[curSc]||SCN.a;
 fn(tm<COVER_HOLD?tm:Math.max(0,tm-(L[li]?L[li].t0:0)));
 X.restore();

 drawSubs();
 drawWatermark();
 X.drawImage(ov,0,0,W,H);
 if(!PORT)composeFrame();

 $('pg').style.width=(cl(tm/Math.max(0.1,LEN))*100).toFixed(2)+'%';
 const s=Math.floor(tm);
 $('clk').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 requestAnimationFrame(draw);
}

function updatePlayIcon(){
 $('pi').innerHTML=playing?'<rect x="6" y="4" width="4" height="16" fill="#0b141a"/><rect x="14" y="4" width="4" height="16" fill="#0b141a"/>':'<path d="M6 4l14 8-14 8z" fill="#0b141a"/>';
 poster.classList.toggle('hide',playing||tm>0.05);
}

function showToast(msg){
 toast.textContent=msg;toast.classList.add('on');
 clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('on'),2600);
}

function togglePlay(){
 initAudio();
 if(tm>=LEN-0.05){tm=0;spoken=-1}
 playing=!playing;
 if(playing){if(ac&&ac.state==='suspended')ac.resume();mNext=ac?ac.currentTime:0;playVoiceAt(tm);if(tm<0.1)sfxImpact()}
 else stopVoice();
 syncActiveVideoPlayback();
 updatePlayIcon();
}

function seekTo(sec){
 tm=cl(sec,0,LEN);li=tm<COVER_HOLD?0:lineAt(tm);spoken=-1;lay=-1;
 if(playing)playVoiceAt(tm);
 syncActiveVideoPlayback();
 updatePlayIcon();
}

$('play').onclick=togglePlay;
frame.onclick=()=>{if(!exporting)togglePlay()};
$('restart').onclick=()=>{seekTo(0);if(!playing)togglePlay()};
$('prevSc').onclick=()=>{const prevRun=Math.max(0,(L[li]?L[li].run:0)-1);const idx=L.findIndex(x=>x.run===prevRun);seekTo(idx>0?L[idx].t0:0)};
$('nextSc').onclick=()=>{const nextRun=(L[li]?L[li].run:0)+1;const idx=L.findIndex(x=>x.run===nextRun);if(idx>=0)seekTo(L[idx].t0)};
$('tl').onclick=e=>{const r=$('tl').getBoundingClientRect();seekTo(((e.clientX-r.left)/r.width)*LEN)};

$('apiBtn').onclick=async()=>{
 const k=prompt('Tempel Pixabay API Key kamu di sini agar video asli otomatis dimuat sesuai setiap kalimat VO:',PIXABAY_KEY);
 if(k!==null){
  PIXABAY_KEY=k.trim();
  localStorage.setItem('pixabay_api_key',PIXABAY_KEY);
  showToast('Memuat video asli dari Pixabay...');
  await preloadAllRealVideos();
  const ok=Object.values(LINE_BROLL_MAP).filter(x=>x&&(x.videoReady||x.photoReady||(x.frameImgs&&x.frameImgs.length>0))).length;
  showToast(ok>0?`Berhasil memuat ${ok} video asli!`:'Cek kembali API key atau koneksi internet.');
 }
};

const SYNCS=[0,-80,-150,80,150];let syncIdx=0;
$('syncBtn').onclick=()=>{syncIdx=(syncIdx+1)%SYNCS.length;SYNC=SYNCS[syncIdx];$('syncBtn').textContent='Sinkron: '+SYNC+' ms';if(playing)playVoiceAt(tm)};

const QUALS=['HD 60 FPS','FHD 60 FPS','SD 30 FPS'];let qIdx=EXPORT_Q_DEFAULT;
$('qBtn').textContent=QUALS[qIdx];
$('qBtn').onclick=()=>{qIdx=(qIdx+1)%QUALS.length;$('qBtn').textContent=QUALS[qIdx]};

$('exp').onclick=()=>{
 if(exporting)return;
 initAudio();exporting=true;$('exp').classList.add('rec');$('exp').textContent='Merekam video...';
 chunks=[];
 const fps=qIdx===2?30:60;
 const stream=cv.captureStream(fps);
 if(dest&&dest.stream)dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
 const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';
 rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:(CW>=1000)?(qIdx===1?16000000:12000000):(qIdx===1?12000000:8000000)});
 rec.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
 rec.onstop=()=>{
  exporting=false;$('exp').classList.remove('rec');$('exp').textContent='Ekspor video HD';
  const blob=new Blob(chunks,{type:mime});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(TITLE.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'video')+'.webm';a.click();
  showToast('Video berhasil diekspor!');
 };
 seekTo(0);playing=true;playVoiceAt(0);sfxImpact();updatePlayIcon();rec.start();
};

(async function boot(){
 try{
  if(DATA.audioUrl){
   try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const tmpAc=new AC();
    const res=await fetch(DATA.audioUrl);
    const arr=await res.arrayBuffer();
    voBuf=await tmpAc.decodeAudioData(arr);
    if(!DATA.duration)setVideoLen(Math.max(LEN,Math.ceil(COVER_HOLD+voBuf.duration+0.6)));
    retime();
    await tmpAc.close();
   }catch(e){console.warn('VO decode fail:',e)}
  }
  if(DATA.charUrl)await initCharSafe(DATA.charUrl);
  await preloadAllRealVideos();
 }catch(err){
  console.warn('Boot warning:',err);
 }finally{
  window.LEN=LEN;
  window.__READY__=true;
  requestAnimationFrame(draw);
 }
})();
</script>
</body>
</html>
