<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Playfair+Display:wght@700;800&family=Noto+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#050b11;--panel:#101a22;--line:#1f2f3a;--txt:#ece6dc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font-family:Poppins,system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 12px}
.frame{position:relative;flex:1;min-height:0;aspect-ratio:__ASPECT__;max-width:100%;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 20px 50px #000a;cursor:pointer}
canvas{display:block;width:100%;height:100%}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0006;backdrop-filter:blur(4px);transition:opacity .3s}
.poster.hide{opacity:0;pointer-events:none}
.poster i{width:70px;height:70px;border-radius:50%;background:var(--txt);display:grid;place-items:center}
.poster i:after{content:"";border-left:21px solid #0b141a;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
.poster p{font-weight:600;font-size:17px;letter-spacing:.12em}
.bar{display:flex;align-items:center;gap:8px;width:100%}
.btn{height:38px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:600 12.5px Poppins,sans-serif;padding:0 13px;cursor:pointer;white-space:nowrap}
.btn.go{background:#e0b877;border-color:#e0b877;color:#1a1208}
.play{width:44px;height:44px;border-radius:50%;background:var(--txt);border:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.play svg{width:18px;height:18px}
.sp{flex:1}
.clk{font:600 12px Poppins,sans-serif;color:#7d909a;text-align:center}
.tl{position:relative;width:100%;height:9px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden;flex-shrink:0}
.tl b{position:absolute;left:0;top:0;bottom:0;width:0;background:#e0b877}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;background:rgba(10,14,20,.94);border:1px solid rgba(255,255,255,.18);font-size:12.5px;font-weight:600;line-height:1.4;padding:9px 14px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="frame" id="frame">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
    <div class="poster" id="poster"><i></i><p id="posterTxt">PUTAR</p></div>
  </div>
  <div class="bar">
    <button class="btn" id="restart">Ulang</button><span class="sp clk" id="clk">0:00</span>
    <button class="play" id="play" aria-label="Putar"><svg viewBox="0 0 24 24" id="pi"><path d="M6 4l14 8-14 8z" fill="#0b141a"/></svg></button>
    <span class="sp"></span>
  </div>
  <div class="tl" id="tl"><b id="pg"></b></div>
  <div class="bar">
    <button class="btn go" id="exp" style="width:100%">Ekspor video</button>
  </div>
</div>

<script>
/* ===== DATA DINAMIS DARI OTAK AI (AUTO-INJECT) ===== */
const DATA = __VIDEO_DATA_JSON__;

const TITLE = DATA.title;
const VARIAN = DATA.varian || 'v' + Math.floor(Math.random()*999);
const LANG = DATA.lang || 'id-ID';
const DESC = DATA.desc || '';
const TAGS = DATA.tags || '#faktaunik #storytelling';
const NOTE = DATA.note || 'Visual berupa animasi karakter dan ilustrasi pendukung.';
const SRC = DATA.src || ['Sumber terverifikasi'];
const TX = DATA.tx;
const L = DATA.lines;
const SC = DATA.scenes;
const BROLL_DATA = DATA.broll || {};
const CW = DATA.width || 720;
const CH = DATA.height || 1280;
const VTHEME = DATA.visual_theme || {};
const SAFE_ZONE = VTHEME.safe_zone || {};

/* [UPGRADE] Pengaman: kunci adegan / mood / teks yang tidak valid dari AI */
{
 const VALID_SC=['title','a','b','cta','c','end'],VALID_MOOD=['n','d','e','s'];
 L.forEach(l=>{
  if(!VALID_SC.includes(l[0]))l[0]='a';
  if(!VALID_MOOD.includes(l[1]))l[1]='n';
  l[2]=String(l[2]==null?'':l[2]);
 });
}

const HALF = .56;
const LP = LANG.split('-')[0].toLowerCase();
const hash = s => {let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const SEED = (typeof VTHEME.seed === 'number') ? VTHEME.seed : hash(TITLE+'|'+VARIAN);
const rnd = (()=>{let a=SEED;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
const PALS = [
 {a:'#ffd452',t:'#5bc0eb',p:'#ff6b6b',g:'#7bed9f',b1:'#0d131a',b2:'#1b2836'},
 {a:'#f7b731',t:'#45aaf2',p:'#eb3b5a',g:'#26de81',b1:'#10141c',b2:'#1e2738'},
 {a:'#fed330',t:'#2bcbba',p:'#fc5c65',g:'#a55eea',b1:'#12101a',b2:'#241f36'},
 {a:'#ffb142',t:'#34ace0',p:'#ff5252',g:'#33d9b2',b1:'#141210',b2:'#29231e'},
 {a:'#ffda79',t:'#706fd3',p:'#ff793f',g:'#3ae374',b1:'#0f1512',b2:'#1c2b24'}];
const P = (VTHEME.palette && VTHEME.palette.a) ? VTHEME.palette : PALS[SEED%PALS.length];
const SPD = .96+rnd()*.18;
const SUBY = Math.round(CH * (SAFE_ZONE.sub_safe_y || 0.855));
const CHAR_MAX_H_RATIO = SAFE_ZONE.char_max_h || (CH > CW ? 0.45 : 0.56);

Object.keys(SC).forEach((k,idx)=>{
  const cols=[P.a,P.t,P.p,P.a,P.g,P.t];
  if(!SC[k][2]) SC[k][2] = cols[idx%cols.length];
});

let LEN = 40;
const ALL = L.map(l=>l[2]).join(' ')+' '+Object.values(TX).join(' ');
const RTL = /[\u0590-\u08ff]/.test(ALL);
const CJKG = /[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/g;
const FAM = (()=>{if(LP==='ja')return'Noto+Sans+JP';if(LP==='ko')return'Noto+Sans+KR';if(LP==='zh')return/TW|HK|Hant/i.test(LANG)?'Noto+Sans+TC':'Noto+Sans+SC';
 const m=[[/[\u0600-\u06ff]/,'Noto+Sans+Arabic'],[/[\u0590-\u05ff]/,'Noto+Sans+Hebrew'],[/[\u3040-\u30ff]/,'Noto+Sans+JP'],[/[\uac00-\ud7af]/,'Noto+Sans+KR'],[/[\u3400-\u9fff]/,'Noto+Sans+SC'],[/[\u0e00-\u0e7f]/,'Noto+Sans+Thai'],[/[\u0980-\u09ff]/,'Noto+Sans+Bengali'],[/[\u0b80-\u0bff]/,'Noto+Sans+Tamil']];
 const f=m.find(x=>x[0].test(ALL));return f?f[1]:''})();
if(FAM){const k=document.createElement('link');k.rel='stylesheet';k.href='https://fonts.googleapis.com/css2?family='+FAM+':wght@600;700;800&display=swap';document.head.appendChild(k)}
const FN = FAM?'"'+FAM.replace(/\+/g,' ')+'"':'';
const SANS = 'Poppins,"Noto Sans",'+(FN?FN+',':'')+'system-ui,sans-serif';
const SERIF = FAM?SANS:'"Playfair Display",Georgia,"Noto Sans",serif';
const COVER_FONT_NAME = VTHEME.cover_font || 'Montserrat';
const COVER_FONT_META = VTHEME.cover_font_meta || { weight: '900', transform: 'uppercase' };
const COVER_FONT = FAM ? SANS : (`"${COVER_FONT_NAME}",` + SANS);

const SEG = (typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter(LANG,{granularity:'word'}):null;
function tok(str){const out=[];str.split('*').forEach((part,i)=>{if(!part)return;const em=i%2==1;
 if(SEG){for(const g of SEG.segment(part)){const s=g.segment;if(/^\s+$/.test(s)){if(out.length)out[out.length-1].sp=true;continue}
  if(g.isWordLike||!out.length||out[out.length-1].sp)out.push({s,em,sp:false});else out[out.length-1].s+=s}}
 else part.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){if(out.length)out[out.length-1].sp=true}else out.push({s:w,em,sp:false})})});return out}
const NL=L.length;let tot=0;const S0={};
L.forEach(l=>{l.w=tok(l[2]);l.t=l[2].replace(/\*/g,'');l.wt=(l.t.replace(CJKG,'xxx').length+(/[.?!。！？؟।…]$/.test(l.t)?22:12))*({s:1.12,d:1.06,e:.98}[l[1]]||1);tot+=l.wt});
function retime(sy){Object.keys(S0).forEach(k=>delete S0[k]);let acc=0,pa=null,kk=0;
 if(sy){L.forEach((l,i)=>{l.t0=sy.t0[i];l.ss=sy.ss[i];l.se=sy.se[i];l.wTimes=sy.wTimes?sy.wTimes[i]:null});L.forEach((l,i)=>{l.d=(i<NL-1?L[i+1].t0:LEN)-l.t0})}
 else L.forEach(l=>{l.d=LEN*l.wt/tot;l.t0=acc;acc+=l.d;l.ss=l.t0+0.04;l.se=l.t0+l.d*0.95;l.wTimes=null});
 L.forEach(l=>{if(l[0]!==pa){pa=l[0];kk=0;S0[pa]=l.t0}l.s=kk++})}
retime();

const $=id=>document.getElementById(id),cv=$('cv'),X=cv.getContext('2d'),W=CW,H=CH,RES=1;cv.width=W*RES;cv.height=H*RES;X.imageSmoothingEnabled=true;X.imageSmoothingQuality='high';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),eo=t=>1-Math.pow(1-t,3),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,bk=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},R=(a,b)=>a+Math.random()*(b-a),S=Math.sin,Co=Math.cos;
const frame=$('frame'),poster=$('poster'),toast=$('toast');
let cvL=0;const COV=.5;
let now=0,A=0,tm=0,playing=false,li=0,spoken=-1,lay=-1,pScene=null,trT=-9,shk=-9,pun=-9,exporting=false,rec=null,chunks=[],au=null,cap=[],last=0,DT=.016,mNext=0;
const lineAt=t=>{let i=0;for(let j=0;j<NL;j++)if(L[j].t0<=t)i=j;return i};
const ov=document.createElement('canvas');ov.width=W;ov.height=H;
{const g=ov.getContext('2d');const q=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.45,W/2,H/2,Math.max(W,H)*0.75);q.addColorStop(0,'#0000');q.addColorStop(1,'#0009');g.fillStyle=q;g.fillRect(0,0,W,H)}
const bl=document.createElement('canvas');bl.width=90;bl.height=160;const bg2=bl.getContext('2d');bg2.imageSmoothingQuality='high';
function bloom(a){bg2.clearRect(0,0,90,160);bg2.drawImage(cv,0,0,90,160);X.save();X.globalCompositeOperation='screen';X.globalAlpha=a;X.drawImage(bl,0,0,W,H);X.restore()}

const rgb=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const al=(c,a)=>{const q=rgb(c);return'rgba('+q[0]+','+q[1]+','+q[2]+','+a+')'};
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}

function txt(s,x,y,sz,col,al2='center',w=800,st=0,ff=SANS){X.font=`${w} ${sz}px ${ff}`;X.direction=RTL?'rtl':'ltr';X.textAlign=al2;X.textBaseline='middle';X.lineJoin='round';if(st){X.lineWidth=st;X.strokeStyle='rgba(0,0,0,.92)';X.strokeText(s,x,y)}X.fillStyle=col;X.fillText(s,x,y)}
const bgc=(a,b)=>{const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);X.fillStyle=g;X.fillRect(0,0,W,H)};
const fog=(y0,y1,c,a)=>{const g=X.createLinearGradient(0,y0,0,y1);g.addColorStop(0,al(c,0));g.addColorStop(1,al(c,a));X.fillStyle=g;X.fillRect(0,Math.min(y0,y1),W,Math.abs(y1-y0))};
const HS={};
function hsp(c){if(HS[c])return HS[c];const k=document.createElement('canvas');k.width=k.height=128;const g=k.getContext('2d'),r=g.createRadialGradient(64,64,4,64,64,64);r.addColorStop(0,al(c,.55));r.addColorStop(.35,al(c,.22));r.addColorStop(.7,al(c,.06));r.addColorStop(1,al(c,0));g.fillStyle=r;g.fillRect(0,0,128,128);return HS[c]=k}
const halo=(x,y,r,c)=>{X.save();X.globalCompositeOperation='lighter';X.drawImage(hsp(c),x-r,y-r,r*2,r*2);X.restore()};
const fz=(t,mw,sz,ff=SANS)=>{X.font=`800 ${sz}px ${ff}`;const w=X.measureText(t).width||1;return Math.min(sz,sz*mw/w)};
const tg=(y,f,c1,c2)=>{const g=X.createLinearGradient(0,y-f*.5,0,y+f*.5);g.addColorStop(0,c1);g.addColorStop(1,c2);return g};

/* ============================================================
   HELPER MOTION GRAPHICS PRO (Gaya Editan Editor Modern)
   - Soft multi-layer shadow
   - Editorial light & dark studio paper texture
   - Staged spring pop-in
   ============================================================ */
function drawEditorCard(x,y,w,h,r,fillCol,borderCol,shadowBlur=34,shadowY=16){
 X.save();
 X.shadowColor='rgba(0,0,0,0.42)';
 X.shadowBlur=shadowBlur;
 X.shadowOffsetY=shadowY;
 X.fillStyle=fillCol;
 rr(x,y,w,h,r);
 X.fill();
 X.restore();
 if(borderCol){
  X.save();
  X.strokeStyle=borderCol;
  X.lineWidth=2.5;
  rr(x,y,w,h,r);
  X.stroke();
  X.restore();
 }
}

function drawEditorialLightStudio(accent){
 /* Latar terang bersih ala motion graphics @galihry.id dengan tekstur grid halus & cahaya lembut */
 bgc('#f5f4f0','#e8e6df');
 X.save();
 X.strokeStyle='rgba(15,23,42,0.045)';
 X.lineWidth=1.5;
 const step=56,ox=(A*16)%step,oy=(A*12)%step;
 for(let x=-step+ox;x<W+step;x+=step){X.beginPath();X.moveTo(x,0);X.lineTo(x,H);X.stroke()}
 for(let y=-step+oy;y<H+step;y+=step){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
 const g=X.createRadialGradient(W*0.5,H*0.36,40,W*0.5,H*0.36,W*0.85);
 g.addColorStop(0,'rgba(255,255,255,0.65)');
 g.addColorStop(1,'rgba(15,23,42,0.12)');
 X.fillStyle=g;X.fillRect(0,0,W,H);
 /* Aksen lingkaran sudut lembut */
 X.fillStyle=al(accent,0.12);
 X.beginPath();X.arc(W*0.88,H*0.14+Math.sin(A*1.2)*14,140,0,Math.PI*2);X.fill();
 X.beginPath();X.arc(W*0.12,H*0.68+Math.cos(A*1.1)*14,170,0,Math.PI*2);X.fill();
 X.restore();
}

const DUST=Array.from({length:34},(_,i)=>({x:(i*83+SEED)%W,y:(i*149+SEED)%H,r:1.6+(i%3)*1.1,sp:26+(i%5)*12,ph:i*0.65}));
function drawLivingDust(col,alpha=0.35){
 X.save();X.fillStyle=col;
 DUST.forEach(d=>{
  const py=(d.y+A*d.sp)%H,px=d.x+Math.sin(A*0.9+d.ph)*14;
  X.globalAlpha=alpha*(0.35+0.55*Math.sin(A*1.5+d.ph));
  X.beginPath();X.arc(px,py,d.r,0,Math.PI*2);X.fill();
 });
 X.restore();
}

function detectVideoTheme(){
 const q=(TITLE+' '+TX.t1+' '+TX.t2+' '+TX.kicker+' '+TX.cvC+' '+DESC).toLowerCase();
 if(/matahari|bumi|bulan|bintang|planet|galaksi|semesta|cahaya|angkasa|orbit|gravitasi|sun|space|star|meteor|astronot/.test(q))return'space';
 if(/laut|samudra|air|ikan|hiu|paus|kapal|tenggelam|kedalaman|tsunami|ocean|sea|underwater|sungai|danau|hujan|air/.test(q))return'ocean';
 if(/uang|kaya|miliarder|bisnis|saham|emas|ekonomi|harga|gaji|bank|money|wealth|investasi|sukses/.test(q))return'money';
 if(/otak|psikologi|pikiran|mental|tidur|mimpi|tubuh|manusia|brain|mind|stres|emosi|kebiasaan|bersin|menguap/.test(q))return'mind';
 if(/ai|teknologi|robot|kode|digital|internet|masa depan|tech|future|komputer|hp|aplikasi|siber/.test(q))return'tech';
 if(/waktu|sejarah|kuno|tahun|detik|menit|jam|time|history|abad|masa lalu|dinosaurus|piramida|spanyol|inca|perang|kerajaan/.test(q))return'time';
 if(/hutan|hewan|gunung|api|petir|pohon|racun|alam|cuaca|nature|forest|volcano|satwa/.test(q))return'nature';
 return'mystery';
}

/* [POIN 5] BACKGROUND KARAKTER HALUS, MODERN & TIDAK BERLEBIHAN (sesuai permintaan poin 5) */
function drawCharacterStudioBackdrop(c1,c2,accent){
 bgc(c1,c2);
 const cx=W/2,cy=H*0.34;
 /* 1. Cahaya rim-light lembut di belakang karakter */
 halo(cx,cy+40,340,accent);
 halo(W*0.18+Math.sin(A*0.4)*25,H*0.22,200,P.t);

 X.save();
 /* 2. Garis arsitektur tipis & elegan (tidak rame/tidak norak) */
 const vIdx=(VTHEME.char_bg_variant||0)%4;
 X.strokeStyle=al(accent,0.11);
 X.lineWidth=1.5;
 if(vIdx===0){
  /* Garis meridian & lintang halus */
  for(let i=-2;i<=2;i++){
   X.beginPath();X.ellipse(cx,cy,90+Math.abs(i)*75,260,0,0,Math.PI*2);X.stroke();
  }
 }else if(vIdx===1){
  /* Gelombang frekuensi halus di bagian atas */
  for(let k=0;k<3;k++){
   X.beginPath();
   for(let x=0;x<=W;x+=28){
    const y=H*0.22+k*36+Math.sin(x*0.014+A*1.3+k)*14;
    if(x===0)X.moveTo(x,y);else X.lineTo(x,y);
   }
   X.stroke();
  }
 }else if(vIdx===2){
  /* Kisi perspektif minimal */
  for(let i=1;i<6;i++){
   const px=(W/6)*i;
   X.beginPath();X.moveTo(px,0);X.lineTo(px,H*0.75);X.stroke();
  }
 }else{
  /* Cincin fokus lembut */
  X.beginPath();X.arc(cx,H*0.32,190+Math.sin(A)*8,0,Math.PI*2);X.stroke();
  X.beginPath();X.arc(cx,H*0.32,275-Math.sin(A)*8,0,Math.PI*2);X.stroke();
 }

 /* 3. Lencana indikator bab kecil di pojok atas (seperti video dokumenter modern) */
 const scKey=L[li]?L[li][0]:'a';
 const scInfo=SC[scKey]||['TOPIK',''];
 const babLabel=(scInfo[0]||TX.kicker||'FAKTA').toUpperCase();
 X.fillStyle='rgba(10,14,22,0.55)';
 rr(cx-120,H*0.065,240,32,16);X.fill();
 X.strokeStyle=al(accent,0.32);X.lineWidth=1.2;rr(cx-120,H*0.065,240,32,16);X.stroke();
 txt(babLabel,cx,H*0.065+16,13,al('#ffffff',0.82),'center',700);
 X.restore();

 drawLivingDust(accent,0.28);
}

/* [POIN 1, 2, 3, 4] SAMPUL AWAL HIDUP, AESTHETIC, RAPI & TIDAK MENIMPA KARAKTER */
function drawCoverTopicCard(ikonTema,cx,cy,col){
 X.save();
 X.translate(cx,cy);
 const bob=Math.sin(A*2.1)*5;
 X.translate(0,bob);

 /* Kartu mengambang dengan rotasi halus seperti kartu UI di video_1.mp4 */
 X.rotate(-0.04);
 drawEditorCard(-136,-44,272,88,22,'rgba(14,20,30,0.88)',al(col,0.65),28,14);

 /* Lingkaran ikon di kiri kartu */
 X.fillStyle=al(col,0.18);
 X.beginPath();X.arc(-84,0,28,0,Math.PI*2);X.fill();
 X.strokeStyle=col;X.lineWidth=3;X.lineCap='round';X.lineJoin='round';
 X.save();X.translate(-84,0);
 switch(ikonTema){
  case 'shield':
   X.beginPath();X.moveTo(0,-14);X.lineTo(12,-8);X.lineTo(12,2);X.quadraticCurveTo(12,11,0,15);X.quadraticCurveTo(-12,11,-12,2);X.lineTo(-12,-8);X.closePath();X.stroke();
   break;
  case 'pulse':
   X.beginPath();X.moveTo(-15,1);X.lineTo(-7,1);X.lineTo(-3,-9);X.lineTo(2,10);X.lineTo(7,-5);X.lineTo(10,1);X.lineTo(15,1);X.stroke();
   break;
  case 'magnifier':
   X.beginPath();X.arc(-3,-3,9,0,Math.PI*2);X.stroke();X.beginPath();X.moveTo(4,4);X.lineTo(12,12);X.stroke();

let cim=null,cimStroke=null,an=null,anBuf=null;
const CS={li:-1,pid:0,pt:-9,dir:1,mv:0,ev:0,tilt:0,sway:0,bounce:0,spin:0,speaking:false};
const POSES={s:[0,0,1,2],n:[0,1,0,2,0],e:[5,4,1,2,5],d:[3,0,3,2,3]};

function vol(){const l=L[li];
 if(!playing)return 0;
 if(an&&au&&!au.paused&&!au.ended){
  an.getFloatTimeDomainData(anBuf);
  let s=0;for(let i=0;i<anBuf.length;i++)s+=anBuf[i]*anBuf[i];
  const r=Math.sqrt(s/anBuf.length);
  return r<.012?0:cl(Math.pow(r*9.2,.78),0,1);
 }
 return(tm>=l.ss&&tm<=l.se)?cl(.32+.44*Math.abs(S(A*11.5))*(.55+.45*Math.abs(S(A*4.8)))):0;
}

function charTick(){
 const l=L[li];
 if(CS.li!==li){
  CS.li=li;
  const arr=POSES[l[1]]||POSES.n;
  CS.pid=(li===0)?0:arr[li%arr.length];
  CS.pt=A;CS.dir=(li%2===0)?1:-1;
  if(CS.pid===4||(l[1]==='e'&&li%3===1))CS.spin=1;
 }
 if(CS.spin>0)CS.spin=Math.max(0,CS.spin-DT*1.65);
 const rawMv=vol();CS.speaking=rawMv>.025;
 const mAlpha=rawMv>CS.mv?(1-Math.pow(.00002,DT)):(1-Math.pow(.0008,DT));
 CS.mv+=(rawMv-CS.mv)*mAlpha;
 const aw=activeWordIdx(l),e0=(aw>=0&&cap[aw]&&cap[aw].em)?1:0;
 CS.ev+=((playing?e0:0)-CS.ev)*(1-Math.pow(.015,DT));
 const amp={e:1.35,d:1.15,s:.65}[l[1]]||1;
 CS.tilt+=((playing?((S(A*2.2)*.032+S(A*3.7)*.014)*amp*(CS.speaking?1:.35)):S(A*.7)*.012)-CS.tilt)*(1-Math.pow(.003,DT));
 CS.sway+=((playing?((S(A*1.65)*8+S(A*3.1)*3)*amp*(CS.speaking?1:.4)):S(A*.65)*2.5)-CS.sway)*(1-Math.pow(.003,DT));
 CS.bounce+=((playing?(CS.mv*14*amp+CS.ev*8):0)-CS.bounce)*(1-Math.pow(.003,DT));
}

function poseXf(id,u,d){
 const e=eo(cl(u/.42)),b=bk(cl(u/.52)),cx=W/2,by=H+15;
 switch(id){
  case 1:return{x:cx-55+15*(1-e),y:by,s:1.06,r:-.05};
  case 2:return{x:cx+55-15*(1-e),y:by,s:1.06,r:.05};
  case 3:return{x:cx+d*24,y:by+30,s:1.16+.04*b,r:d*.04};
  case 4:return{x:cx,y:by-S(e*Math.PI)*45,s:1.04,r:0};
  case 5:return{x:cx+d*32,y:by-5,s:1.03+.05*b,r:d*.045};
  default:return{x:cx,y:by,s:1.02,r:0};
 }
}

function char(o={}){
 if(!cim)return;
 const u=Math.max(0,A-CS.pt),p=poseXf(CS.pid,u,CS.dir),pLerp=1-Math.pow(.0005,DT);
 if(!char._x){char._x=p.x;char._y=p.y;char._s=p.s;char._r=p.r}
 char._x+=(p.x+(o.ox||0)-char._x)*pLerp;
 char._y+=(p.y+(o.oy||0)-char._y)*pLerp;
 char._s+=(p.s*(o.sc||1)-char._s)*pLerp;
 char._r+=(p.r-char._r)*pLerp;
 const spinProgress=1-CS.spin,spinScaleX=CS.spin>0?Math.cos(spinProgress*Math.PI*2):1,spinTilt=CS.spin>0?Math.sin(spinProgress*Math.PI*2)*0.16:0;
 const x=o.fixedCover?(W/2+(o.ox||0)):(char._x+CS.sway);
 const y=o.fixedCover?(H+15+(o.oy||0)):(char._y-CS.bounce+S(A*2.2)*4);
 const s=o.fixedCover?(o.sc||1):(char._s*(1+CS.mv*0.025));
 const r=o.fixedCover?0:(char._r+CS.tilt+spinTilt);
 let DW=Math.min(510,W*0.72),DH=DW*cim.height/cim.width;
 if(DH>H*CHAR_MAX_H_RATIO){DH=H*CHAR_MAX_H_RATIO;DW=DH*cim.width/cim.height}
 X.save();X.globalAlpha*=(o.a==null?1:o.a);X.translate(x,y);X.rotate(r);X.scale(s*spinScaleX,s);

 X.drawImage(cim,-DW/2,-DH,DW,DH);X.restore();
}

function initCharFromUrl(url){
 return new Promise(resolve=>{
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{
   const tw=440,th=440,cc=document.createElement('canvas');cc.width=tw;cc.height=th;
   const cx=cc.getContext('2d',{willReadFrequently:true});
   const sc0=Math.min(tw/im.width,th/im.height),dw=im.width*sc0,dh=im.height*sc0,ox=(tw-dw)/2,oy=(th-dh)/2;
   cx.drawImage(im,ox,oy,dw,dh);
   const p=cx.getImageData(0,0,tw,th).data;
   let a=tw,b=0,c=th,d=0;
   for(let y=0;y<th;y++)for(let x=0;x<tw;x++)if(p[(y*tw+x)*4+3]>60){if(x<a)a=x;if(x>b)b=x;if(y<c)c=y;if(y>d)d=y}
   const fullH=(d-c)/sc0,sx=Math.max(0,(a-ox)/sc0),sy=Math.max(0,(c-oy)/sc0),sw=Math.min(im.width-sx,(b-a)/sc0),sh=Math.min(im.height-sy,fullH*HALF);
   const OW=600,OH=Math.max(120,Math.round(OW*sh/sw)),oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
   const og=oc.getContext('2d');og.imageSmoothingEnabled=true;og.imageSmoothingQuality='high';
   og.drawImage(im,sx,sy,sw,sh,0,0,OW,OH);
   const PAD=10,SW=OW+PAD*2,SH=OH+PAD*2,sc=document.createElement('canvas');sc.width=SW;sc.height=SH;
   const sg=sc.getContext('2d'),rStroke=5;
   for(let ang=0;ang<Math.PI*2;ang+=Math.PI/8)sg.drawImage(oc,PAD+Math.cos(ang)*rStroke,PAD+Math.sin(ang)*rStroke);
   sg.globalCompositeOperation='source-in';sg.fillStyle='#ffffff';sg.fillRect(0,0,SW,SH);
   cim=oc;cimStroke=sc;CS.pt=A;CS.pid=0;resolve(true);
  };
  im.onerror=()=>resolve(false);
  im.src=url;
 });
}

function initCharSafe(url){
 return Promise.race([
  initCharFromUrl(url).catch(()=>false),
  new Promise(r=>setTimeout(()=>r(false),8000))
 ]);
}

    for(let g=k;g<G;g++){
     const c=(gp[g].s+gp[g].e)/2,nv=v+Math.abs(c-e)/span*9-Math.min(gp[g].d,1.1)*.65;
     if(nv<dp[i+1][g+1]){dp[i+1][g+1]=nv;pk[i+1][g+1]=k;mt[i+1][g+1]=1}
    }
   }
  }
  let k=0,bv=1e9;for(let q=0;q<=G;q++)if(dp[N][q]<bv){bv=dp[N][q];k=q}
  for(let i=N;i>=1;i--){if(mt[i][k]){const g=gp[k-1];ss[i]=g.e;se[i-1]=g.s}k=pk[i][k]}
 }
 for(let i=1;i<NL;i++)if(ss[i]==null){let p=i-1;while(ss[p]==null)p--;let q=i+1;while(ss[q]==null)q++;ss[i]=ss[p]+(ss[q]-ss[p])*(cw[i]-cw[p])/(cw[q]-cw[p]);se[i-1]=ss[i]-.05}
 se[N]=z;const t0=[0];for(let i=1;i<NL;i++)t0.push(Math.max(t0[i-1]+.35,ss[i]-.02));
 const s2=ss.slice(0,NL).map((v,i)=>Math.max(v,t0[i]));
 const e2=se.map((v,i)=>Math.max(v,(i<NL-1)?(s2[i+1]-.02):z,s2[i]+.4));
 const wTimes=L.map((l,i)=>mapWordTimes(l,s2[i],e2[i],r.sm,r.fd,r.th));
 return{t0,ss:s2,se:e2,wTimes};
}

function setIcon(){$('pi').innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="#0b141a"/>':'<path d="M6 4l14 8-14 8z" fill="#0b141a"/>'}
function play(){if(tm>=LEN-.05)tm=0;if(!au&&tm>0)tm=L[lineAt(tm)].t0;aInit();bed(true);cvL=tm<.05?COV:0;playing=true;spoken=-1;CS.li=-1;capLineIdx=-1;mNext=tm+1;setIcon();poster.classList.add('hide');sceneAudio(L[lineAt(tm)][0]);if(au){au.currentTime=tm;setTimeout(()=>playing&&au.play().catch(()=>{}),cvL*1000)}}
function stop(){playing=false;au&&au.pause();bed(false);setIcon();poster.classList.remove('hide')}
function finish(){playing=false;au&&au.pause();bed(false);setIcon();if(exporting)setTimeout(stopRec,900)}
$('play').onclick=frame.onclick=()=>exporting?0:(playing?stop():play());

let toastT=0;
function note(msg){toast.textContent=msg;toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('on'),2600)}

$('restart').onclick=()=>{
 if(exporting)return;
 stop();tm=0;if(au)au.currentTime=0;
 pScene=null;lay=-1;capLineIdx=-1;spoken=-1;
 play();
};

$('tl').onclick=e=>{
 if(exporting)return;
 const r=$('tl').getBoundingClientRect(),p=cl((e.clientX-r.left)/r.width);
 const target=L[lineAt(p*LEN)].t0;
 tm=target;if(au)au.currentTime=target;
 pScene=null;lay=-1;capLineIdx=-1;spoken=-1;
};

$('exp').onclick=()=>{
 if(exporting)return;
 aInit();
 if(!ac||!dest||typeof MediaRecorder==='undefined'){note('Browser ini belum mendukung ekspor video');return}
 const btn=$('exp');
 const vT=cv.captureStream(30).getVideoTracks(),aT=dest.stream.getAudioTracks();
 const mt=['video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
 const mr=new MediaRecorder(new MediaStream([...vT,...aT]),mt?{mimeType:mt,videoBitsPerSecond:6e6}:{});
 const parts=[];
 mr.ondataavailable=e=>e.data.size&&parts.push(e.data);
 mr.onstop=()=>{
  const b=new Blob(parts,{type:mr.mimeType||'video/webm'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='video_'+VARIAN+'.webm';
  document.body.appendChild(a);a.click();a.remove();
  btn.textContent='Ekspor video';btn.disabled=false;note('Video berhasil diekspor');
 };
 rec=mr;chunks=parts;
 btn.textContent='Mengekspor... mohon tunggu';btn.disabled=true;
 stop();tm=0;if(au)au.currentTime=0;
 pScene=null;lay=-1;capLineIdx=-1;spoken=-1;
 exporting=true;
 mr.start(250);
 play();
};

/* ===== AUTO-LOAD ASET & AUTO-EXPORT UNTUK ROBOT RENDER ===== */
window.__EXPORT_DONE = false;
function stopRec(){
 exporting=false;
 if(rec&&rec.state!=='inactive')rec.stop();
}

const FONTS_READY=Promise.race([
 Promise.all([
  ...['600','700','800','900'].map(w=>document.fonts.load(w+' 40px Poppins')),
  document.fonts.load('800 40px "Playfair Display"'),
  document.fonts.load('700 40px "Noto Sans"'),
  document.fonts.load('900 48px "'+COVER_FONT_NAME+'"'),
  ...(FN?[document.fonts.load('800 40px '+FN)]:[])
 ]).then(()=>document.fonts.ready),
 new Promise(r=>setTimeout(r,5000))
]).catch(()=>{});

async function initAutoAssetsAndRender(){
 await FONTS_READY;
 await initCharSafe('karakter.png');
 try{
  const resp = await fetch('vo.mp3');
  if(resp.ok){
   const buf = await resp.arrayBuffer();
   const blob = new Blob([buf],{type:'audio/mpeg'});
   au = new Audio(URL.createObjectURL(blob));
   au.addEventListener('playing',()=>{if(exporting&&window.__VO_OFFSET==null&&window.__REC_T0)window.__VO_OFFSET=(performance.now()-window.__REC_T0)/1000});
   aInit();
   if(ac){
    const ab = await ac.decodeAudioData(buf.slice(0));
    LEN = Math.ceil(ab.duration + 0.8);
    const sy = syncVO(ab);
    retime(sy);
   }
  }
 }catch(e){console.error(e)}

 if(new URLSearchParams(window.location.search).get('autorender') === '1'){
  aInit();
  if(ac && ac.state==='suspended') await ac.resume();
  const vTracks = cv.captureStream(30).getVideoTracks();
  let aTracks = (dest && dest.stream) ? dest.stream.getAudioTracks() : [];
  const ms = new MediaStream([...vTracks, ...aTracks]);
  const mt = ['video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t)) || '';
  rec = new MediaRecorder(ms, mt ? {mimeType:mt, videoBitsPerSecond:6e6} : {});
  chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
   const b = new Blob(chunks, {type: rec.mimeType || 'video/webm'});
   const a = document.createElement('a');
   a.href = URL.createObjectURL(b);
   a.download = 'hasil_mentah.webm';
   document.body.appendChild(a);
   a.click();
   window.__EXPORT_DONE = true;
  };
  exporting = true;
  window.__REC_T0 = performance.now();
  rec.start(250);
  tm = 0; pScene = null; lay = -1; capLineIdx = -1;
  play();
 }
}

requestAnimationFrame(loop);
window.addEventListener('load', initAutoAssetsAndRender);
